<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#286d59">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>担当案件｜営業の相棒</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="../assets/favicon-32.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../mockup/mockup.css">
  <link rel="stylesheet" href="./cases.css">
  <script type="module" src="./cases.mjs"></script>
</head>
<body>
  <header class="topbar">
    <span class="brand">営業の相棒</span>
    <button type="button" id="logout" class="button" hidden>ログアウト</button>
  </header>
  <main>
    <section class="hero" aria-labelledby="cases-heading">
      <div>
        <h1 id="cases-heading">CAD担当案件</h1>
        <p>本番シートを閲覧</p>
      </div>
      <img src="../mockup/aibo-bird.png" width="84" height="84" alt="">
    </section>
    <p id="status" class="sync" role="status" aria-live="polite">接続を確認しています。</p>
    <section id="login" class="panel" aria-label="Googleログイン" hidden>
      <div id="google-login"></div>
      <button type="button" id="retry-login" class="button" hidden>ログインをやり直す</button>
    </section>
    <section id="dashboard" aria-label="担当案件の一覧" hidden>
      <form id="filters" class="panel">
        <label class="case-search">案件を検索 <input type="search" id="search" placeholder="受注先・現場名・受付番号" autocomplete="off"></label>
        <label>案件区分 <select id="bucket">
          <option>見積</option><option>受注</option><option>上棟済</option><option>失注</option>
        </select></label>
        <label><input id="past" type="checkbox"> 過去物件を含める</label>
        <button type="submit" class="button" id="refresh">最新情報を取得</button>
      </form>
      <p id="counts" class="case-counts"></p>
      <div id="initial-loading" class="case-loading" aria-hidden="true" hidden><span></span><span></span></div>
      <div class="section-list" id="cards"></div>
    </section>
  </main>
</body>
</html>
