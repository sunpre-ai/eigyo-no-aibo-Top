:root{font-family:system-ui,sans-serif;color:#243f45;background:#f6f7ef;font-size:16px}*{box-sizing:border-box}body{margin:0}header{padding:20px;background:#e2f0e9}header h1{margin:0;font-size:24px}main{max-width:1200px;margin:auto;padding:16px}button,input,select,textarea{font:inherit;padding:12px;border:1px solid #b4c5bf;border-radius:12px;max-width:100%}input,select,textarea{width:100%;background:white;color:#243f45}label{display:block;margin:12px 0}button{background:#fff;color:#243f45;cursor:pointer;min-height:44px}button.primary{background:#277962;color:white}button.home{background:#ffcf84;color:#593413}button:disabled{opacity:.5;cursor:wait}nav,.row{display:flex;gap:10px;flex-wrap:wrap}nav{margin:16px 0}article,.panel{background:white;border:1px solid #d5e2dc;border-radius:16px;padding:16px;margin:12px 0;overflow-wrap:anywhere}h2,h3{margin:0 0 12px;font-weight:600}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px}.grid article{margin:0}.pill{display:inline-block;padding:5px 10px;border-radius:10px;background:#eef4f0}.warn{background:#fff0d9;color:#834500}.late{background:#ffe5df;color:#9e2b21}p{margin:10px 0}.small{font-size:14px;color:#536868}.stats{display:flex;flex-wrap:wrap;gap:12px}.stats>div{flex:1;min-width:120px;padding:16px;background:#fff0d9;border-radius:16px}.stats strong{font-size:26px;display:block}#message{white-space:pre-wrap;padding:10px;color:#8b3829}#login{max-width:460px;margin:24px auto}textarea{min-height:100px}.daily-report-line{display:block;min-height:1.8em}.daily-report-detail{margin-left:2em}fieldset{border:0;padding:0;margin:0}a{color:#196a58}button:focus-visible,input:focus-visible{outline:3px solid #ffab47;outline-offset:2px}@media(min-width:850px){.layout{display:grid;grid-template-columns:180px 1fr;gap:20px}nav{flex-direction:column;align-self:start}nav button{text-align:left}header{padding-left:max(20px,calc((100vw - 1200px)/2))}}

</section><section id="app" hidden><div class="app-toolbar"><strong id="user"></strong><span id="pwa-operation-status" role="status" aria-live="polite"></span><button id="pwa-refresh-shell" type="button" hidden>新しい画面へ更新</button><button id="notifications" class="notification-button" aria-label="新着通知">🔔 お知らせ<span id="notification-count" class="notification-count" hidden></span></button></div><p id="project-data-warning" class="panel" role="status" hidden>案件IDの未設定または重複があるため、一部の案件は表示を保留しています。案件の更新にも影響するため、管理者に確認してください。</p><div id="schedule-priority" hidden aria-live="polite"></div><div id="today-erections" hidden></div><div id="pwa-list-sync" class="pwa-list-sync" hidden><span id="pwa-list-sync-time" role="status"></span><button type="button" id="pwa-list-refresh">最新に更新</button></div><div id="pwa-confirm-feedback" role="status" aria-live="polite" hidden></div><details class="app-controls"><summary>表示・データ更新・設定</summary><div class="row"><label>表示する役割<select id="role"></select></label><button id="refresh">案件データを更新</button><a class="screen-refresh" href="./index.html">🔄 画面を最新版に更新</a><button id="logout">ログアウト</button></div><div class="row past-control"><strong id="case-count"></strong><span id="past-note" class="small"></span><button id="past-toggle" aria-pressed="false">過去物件を表示</button></div></details><section id="admin-preview-banner" class="panel warn" hidden></section><div class="layout"><button type="button" id="menu-toggle" aria-expanded="false" aria-controls="main-nav">☰ ほかの画面を開く</button><nav id="main-nav" aria-label="画面"><button class="home" data-tab="home">🏠 ホーム</button><button data-tab="overview">業務サマリー</button><button id="schedule-nav" data-tab="schedule">🗓 予定</button><button data-tab="cad-monthly" id="cad-monthly-nav">📐 CAD月間実績</button><button data-tab="cad-team" id="cad-team-nav">👥 CADチーム</button><button data-tab="cases">📁 案件</button><button data-tab="quotes">📝 見積用</button><button data-tab="cancellations">📦 受注キャンセル</button><button data-tab="prevention" id="prevention-nav">🛡 ミス・再発防止</button><button data-tab="questions">💬 確認依頼</button><button data-tab="troubles">🆘 困っていること</button><button data-tab="daily" id="daily-nav">📝 日報</button><button data-tab="performance" id="performance-nav">🏆 月間成績</button><button data-tab="prospects" id="prospect-nav">🌱 新規開拓</button></nav><section id="content" tabindex="-1"></section></div><button type="button" id="floating-home" class="floating-home" data-tab="home" aria-label="ホームへ戻る">🏠 ホーム</button></section></main><script>
function applyCadProgressResult(result,expectedToken){if(token!==expectedToken||data?.adminPreview||role!=='CAD'||!result?.saved||!result.project||result.project.id!==result.caseId||!data.projects.some(p=>p.id===result.caseId))return false;data.projects=data.projects.map(p=>p.id===result.caseId?{...p,...result.project}:p);if(result.today)data.today=result.today;if(result.cadWorkToday)data.cadWorkToday=result.cadWorkToday;if(result.cadMonthly)data.cadMonthly=result.cadMonthly;if(data.cadCalendar){data.cadCalendar.items.forEach(x=>{if(x.caseId===result.caseId){x.complete=!!result.project.complete;x.overdue=!x.complete&&!x.multiple&&!x.stale&&x.date<data.today;}});const current=data.projects.find(p=>p.id===result.caseId);if(current.cadCalendarPlan)current.cadCalendarPlan={...current.cadCalendarPlan,complete:!!result.project.complete};}render();return true;}
function openCadWorkCase(id){const p=data?.projects.find(p=>p.id===id);if(role!=='CAD'||!p||p.cad!==data.user.alias&&!data.user.cadLeader)return;if(p.cad!==data.user.alias)tab='cad-team';selected=id;render();}
document.addEventListener('click',e=>{const b=e.target.closest('[data-cad-work-case]');if(b){e.stopImmediatePropagation();openCadWorkCase(b.dataset.cadWorkCase);}});
function cadCalendarCaseDate(p){const plan=p.cadCalendarPlan;if(!plan)return '';return '<p class="small '+(!plan.complete&&!plan.stale&&!plan.multiple&&plan.date<data.today?'late':'')+'">📅 データ完成予定：'+escape(plan.multiple?'複数予定あり・要確認（'+plan.dates.join(' ／ ')+')':plan.date)+(plan.complete?' ✓ データ完成済':plan.stale?'（前回取得・要確認）':'')+'</p>';}
// 既存の進捗・期限から仕事を集約する。確認済みを作業完了とは扱わない。
function stockAllocationFields(v){
 return '<details><summary>材料ごとの数量・現場引当を記録（任意）</summary><p class="small">主に確認したい材料1種類を記録します。ほかの材料はメモへ。同じ在庫を照合する案件では、寸法・長さ・等級・保管場所・ロットを含む同じキーを使用してください。</p><label>材料の照合キー<input name="materialKey" maxlength="150" value="'+escape(v.materialKey||'')+'" placeholder="例：杉／120角／3m／等級／倉庫A／ロット"></label><label>数量の単位<input name="unit" maxlength="20" value="'+escape(v.unit||'')+'" placeholder="本・枚など"></label>'+[['required','今回の必要数量'],['available','現場に確認した今回使える数量（他案件引当を除く）'],['reserved','現場でこの案件へ引当済みの数量']].map(([key,label])=>'<label>'+label+'<input type="number" min="0" max="100000000" step="any" name="'+key+'" value="'+escape(v[key]??'')+'"></label>').join('')+'<label>現場での引当確認<select name="allocation">'+['未確認','現場引当確認済み','解除'].map(x=>'<option '+(v.allocation===x?'selected':'')+'>'+x+'</option>').join('')+'</select></label><p class="small">この登録だけでは現場の在庫を確保・減算しません。引当は現場担当者に依頼し、確認後に記録してください。</p></details>';
}
function stockAllocationInfo(p){
 const v=p.stockConfirmation||{},warning=p.stockAllocationWarning;
 if(!v.materialKey)return '';
 const qty=n=>n==null?'未確認':Number(n).toLocaleString('ja-JP')+' '+(v.unit||''),shortage=v.required!=null&&v.available!=null?Math.max(0,v.required-v.available):null;
 return '<div class="panel"><p><strong>材料：'+escape(v.materialKey)+'</strong><br>必要数：'+escape(qty(v.required))+' ／ 今回使える数：'+escape(qty(v.available))+'<br>不足の目安：'+escape(qty(shortage))+' ／ この案件の現場引当：'+escape(qty(v.reserved))+'<br>引当確認：'+escape(v.allocation||'未確認')+'</p>'+(warning?.otherCount?'<p class="late">⚠ 同じ照合キーで、ほかの'+warning.otherCount+'案件に合計 '+escape(qty(warning.otherReserved))+' の現場引当記録があります。今回使える数量から除外済みか、現場担当者へ再確認してください。</p>':'')+'<p class="small">確認時点の記録です。発注数は入荷予定・発注残も照合して決めてください。</p></div>';
}
function workFocusHome(ps){
 const allowed=new Set(ps.map(p=>p.id)),notices=(data.importantNotices||[]).filter(n=>allowed.has(n.caseId)||n.kind==='受注キャンセル'&&(data.orderCancellations||[]).some(c=>c.id===n.caseId)),pending=notices.filter(n=>n.pending),done=notices.filter(n=>!n.pending);
 const notice=n=>'<article class="'+(n.pending?'warn':'reviewed-item')+'"><h3>'+escape(n.kind+'：'+n.customer+' ／ '+n.site)+'</h3><p class="small">'+escape(n.at)+'</p>'+n.changes.map(line=>'<p>'+escape(line)+'</p>').join('')+n.targets.map(t=>'<p><strong>'+escape(t.name)+(t.own?'（自分）':'')+'</strong>：'+(t.readAt?'✓ 確認済み '+escape(t.readAt):'⚠ 確認待ち')+'<br><small>メール：'+escape(t.mailStatus)+'</small></p>').join('')+(n.targets.some(t=>t.own&&!t.readAt)?'<button type="button" data-tab="notifications">自分のお知らせで確認する</button>':'')+(n.kind==='受注キャンセル'?'<button type="button" data-tab="cancellations">キャンセルの対応状況を見る</button>':'')+'</article>';
 const updates=ps.map(p=>({p,events:(p.activity?.items||[]).filter(e=>e.kind!=='receipt'&&!e.own&&(p.activity?.unreadTokens||[]).includes(e.token))})).filter(x=>x.events.length).sort((a,b)=>b.events[0].at.localeCompare(a.events[0].at));
 const update=({p,events})=>'<article><h3>'+escape(p.customer+' ／ '+p.site)+' <span class="pill">'+events.length+'件をまとめて表示</span></h3>'+events.slice(0,3).map(e=>'<p><strong>'+escape(e.title)+'</strong><br><small>'+escape(e.at+' ／ '+e.by)+'</small><br>'+escape(e.detail||'')+'</p>').join('')+(events.length>3?'<p class="small">ほかの変更は案件の履歴で確認できます。</p>':'')+'<button type="button" '+(role==='管理者'?'data-work-case':'data-case')+'="'+escape(p.id)+'">変更内容・共有進捗を見る</button></article>';
 return '<section class="panel work-focus" aria-label="重要連絡の確認待ち"><h2>📣 重要連絡の確認待ち <span class="pill">'+pending.length+'件</span></h2><p class="small">日程変更・受注キャンセルの通知先ごとの確認です。メール送信済みと、相手がアプリの「確認しました」を押した状態は別に表示します。確認は作業完了を意味しません。</p>'+(pending.length?pending.slice(0,4).map(notice).join('')+(pending.length>4?'<details><summary>ほかの確認待ち '+(pending.length-4)+'件</summary>'+pending.slice(4).map(notice).join('')+'</details>':''):'<p class="progress-done">現在、記録で確認できる重要連絡の確認待ちはありません。</p>')+(done.length?'<details><summary>相手の確認が済んだ連絡 '+done.length+'件</summary>'+done.slice(0,20).map(notice).join('')+'</details>':'')+'<p class="small">日程変更は現在保持されている最新の通知、キャンセルは有効な登録が対象です。アプリ外の口頭・メール返信は自動で確認済みになりません。</p></section><details class="panel"><summary>🕒 未確認の進捗を案件ごとにまとめて確認 '+updates.length+'案件</summary><p class="small">細かな進捗は案件単位でまとめます。「変更内容を確認しました」は案件の履歴から記録できます。最新情報は「案件データを更新」で取得してください。</p>'+updates.slice(0,5).map(update).join('')+(updates.length>5?'<details><summary>ほかの更新 '+(updates.length-5)+'案件</summary>'+updates.slice(5).map(update).join('')+'</details>':'')+(!updates.length?'<p>未確認の進捗変更はありません。</p>':'')+'</details>';
}
function todayWorkItems(ps,team=false){
 const today=data.today,soon=new Date(Date.parse(today+'T00:00:00Z')+3*86400000).toISOString().slice(0,10),items=new Map(),manager=role==='管理者'||team&&role==='CAD'&&!!data.user?.cadLeader;

function teamSummary(ps){if(!['管理者','営業'].includes(role))return '';const people=role==='管理者'?(data.salesPeople||[]):[{alias:data.user.alias,name:data.user.name}];return '<section class="team-summary" aria-label="営業担当者別の集計"><h2>'+ (role==='管理者'?'👥 営業チームの状況':'📊 自分の担当案件') +'</h2><p class="small">'+(role==='管理者'?'担当者全員を一度に表示します。':'自分の担当案件だけを集計します。')+'件数は現在の表にある案件が対象です。</p><div class="team-grid">'+people.map(person=>{const assigned=ps.filter(p=>p.sales===person.alias),active=assigned.filter(p=>p.outcome!=='失注'),quotes=assigned.filter(p=>p.outcome==='見積'),orders=assigned.filter(p=>matchesBucket(p,'受注')),waiting=data.questions.filter(q=>q[7]==='回答待ち'&&active.some(p=>p.id===q[1])),overdue=quotes.filter(p=>p.quoteDeadline&&p.quoteDeadline<data.today&&!['見積提出','値段交渉'].includes(p.stage)),reports=data.reports.filter(r=>r[7]==='営業未確認'&&active.some(p=>p.id===r[1]));return '<article class="team-card" data-sales="'+escape(person.alias)+'"><h3>'+escape(person.name)+'さん</h3><div class="team-numbers"><div class="team-number"><span>見積物件</span><strong>'+quotes.length+'件</strong></div><div class="team-number"><span>受注物件</span><strong>'+orders.length+'件</strong></div><div class="team-number '+(waiting.length?'attention':'')+'"><span>CAD未回答</span><strong>'+waiting.length+'件</strong></div><div class="team-number '+(overdue.length?'overdue':'')+'"><span>見積期限超過</span><strong>'+overdue.length+'件</strong></div></div><p class="small">上棟済：'+assigned.filter(p=>matchesBucket(p,'上棟済')).length+'件<br>新規開拓中：'+(data.prospects||[]).filter(p=>p.alias===person.alias&&!['初受注','終了'].includes(p.stage)).length+'社<br>図面完了報告・営業未確認：'+reports.length+'件</p></article>'}).join('')+'</div></section>'}

function managerProgress(ps,fixedBucket){const all=ps.filter(p=>!inErectionBucket(p)&&['見積','受注'].includes(p.outcome));ps=all.filter(p=>matchesBucket(p,fixedBucket||progressFilter));const stages=new Map();ps.forEach(p=>{const stage=p.erectionDone?'上棟済':p.source==='データ'?(p.complete?'加工データ完成':p.structural==='作成中'||p.secondary==='作成中'?'データ作成中':'データ作成・未確認'):(p.stage||'工程未登録');stages.set(stage,(stages.get(stage)||0)+1)});return '<section class="overview-section manager-progress">'+(fixedBucket?'<h2>見積用（'+ps.length+'件）</h2><p class="small">管理台帳の「見積」タブでも新規受付できます。案件IDは空欄のまま、受注先名・現場名・担当営業・CADを入力してください。通常10分以内に自動採番します。その後「案件データを更新」で確認してください。既存の案件IDは変更・コピーしないでください。</p><p class="small">新規見積の依頼は、担当CAD設定後に自動通知します。シートの直接入力・担当設定は通常10分以内に確認し、CADのお知らせへ表示します。メールは通知作成後、通常5分以内に送信します。CAD未設定の間は保留します。既存の見積案件も、CAD未設定を確認した後に担当を設定すると一度だけ通知します。すでに担当設定済みの既存案件への一斉通知はしません。</p>':'<h2>📋 物件ごとの進捗一覧</h2>'+progressTabs(all))+'<div class="row">'+[...stages].map(([stage,count])=>'<span class="pill">'+escape(stage)+' '+count+'件</span>').join('')+'</div>'+(fixedBucket?'':'<p class="small">表の中を上下にスクロールしても見出しは固定されます。受注の進捗は仕様書・承認・データ作成の状態を表示します。工場の加工確認は各部材タブの「確認」チェックを反映します（CADのデータ完成・出荷完了とは別）。最新の確認には「案件データを更新」を押してください。</p>')+'<div class="overview-table-wrap" tabindex="0" role="region" aria-label="見出し固定の一覧表"><table class="overview-table"><thead><tr><th>受注先・現場</th><th>担当</th><th>商談・工程</th><th>仕様書・承認</th><th>構造材／羽柄合板</th><th>工場の加工確認</th></tr></thead><tbody>'+progressTableRows(ps,p=>'<tr><td><strong>'+escape(p.customer)+'</strong><br>'+escape(p.site)+' '+caseActivityBadge(p)+caseActivityHint(p)+(p.activity?.items.length?'<button type="button" data-case-history="'+escape(p.id)+'">履歴・変更を確認</button>':'')+receiptDate(p)+(p.outcome==='受注'?caseDates(p):'')+customerMistakeHistory(p)+customerGuidanceHint(p)+quoteOrderDetectionPanel(p)+(p.source==='見積'?'<button type="button" data-case="'+escape(p.id)+'">案件・担当設定を開く</button>':'')+'</td><td>営業 '+escape(p.sales)+'<br>CAD '+escape(p.cad)+'</td><td><span class="pill">'+escape(p.erectionDone?'上棟済':p.outcome)+'</span><br>'+escape(p.stage||'未登録')+'<br>営業：'+progressText(p.salesProgress?.stage||'作業状況未登録')+'<br>CAD：'+progressText(p.cadProgress?.stage||'作業状況未登録')+'</td><td>'+(p.source==='データ'?progressText(p.spec||'仕様書未登録')+' / '+progressText({'':'承認未登録',打:'打合せ中',待:'承認待ち',承:'承認済'}[p.approval]||p.approval):'—')+'</td><td>'+(p.source==='データ'?progressText(p.structural||'未入力')+' / '+progressText(p.secondary||'未入力')+'<br>'+progressText(p.complete?'全データ完成':'全データ未完了'):'—')+'</td><td>'+factoryProgress(p)+'</td></tr>')+'</tbody></table></div></section>'}

function delayDate(value){
 const v=String(value||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(v))return '';const ms=Date.parse(v+'T00:00:00Z');return Number.isFinite(ms)&&new Date(ms).toISOString().slice(0,10)===v?v:'';
}
function summarizeWorkDelays(active,registered,tasks,ownerKey){
 const byId=new Map(active.map(p=>[p.id,p])),today=delayDate(data.today),todayMs=Date.parse(today+'T00:00:00Z'),names=new Map((registered||[]).map(p=>[p.alias,p.name]));
 active.forEach(p=>{const alias=p[ownerKey]||'';if(!names.has(alias))names.set(alias,alias||'担当未設定');});
 const people=new Map([...names].map(([alias,name])=>[alias,{alias,name,overdue:new Map(),waiting:new Map(),missing:new Map(),items:[]}]));
 for(const task of tasks){
  const p=byId.get(task.caseId);if(!p)continue;const person=people.get(p[ownerKey]||''),waiting=!!task.waiting,due=delayDate(task.due),days=due?Math.max(0,Math.floor((todayMs-Date.parse(due+'T00:00:00Z'))/86400000)):0;
  const item={...task,customer:p.customer,site:p.site,waiting,due,days,priority:days>0?(waiting?1:0):due===today?2:!due&&!waiting?3:waiting?4:5};
  person.items.push(item);const bucket=waiting?person.waiting:days>0?person.overdue:!due?person.missing:null;
  if(bucket){if(!bucket.has(p.id))bucket.set(p.id,[]);bucket.get(p.id).push(item);}
 }
 const rows=[...people.values()].map(p=>({...p,overdueCount:p.overdue.size,waitingCount:p.waiting.size,missingCount:p.missing.size,waitingOverdue:[...p.waiting.values()].filter(items=>items.some(t=>t.days>0)).length,maxDays:Math.max(0,...[...p.overdue.values()].flat().map(t=>t.days)),items:p.items.sort((a,b)=>a.priority-b.priority||(a.due||'9999').localeCompare(b.due||'9999')||a.id.localeCompare(b.id))})).sort((a,b)=>b.overdueCount-a.overdueCount||b.maxDays-a.maxDays||b.waitingOverdue-a.waitingOverdue||b.waitingCount-a.waitingCount||b.missingCount-a.missingCount||a.name.localeCompare(b.name,'ja'));
 const count=key=>new Set(rows.flatMap(p=>[...p[key].keys()])).size;
 return {rows,overdue:count('overdue'),waiting:count('waiting'),missing:count('missing'),maxDays:Math.max(0,...rows.map(p=>p.maxDays))};
}

 return '<section class="schedule-priority-panel" aria-label="最優先の日程確定・変更"><h2 tabindex="-1">📅 '+(role==='営業'?'担当案件の日程変更':'最優先：上棟日・第一出荷日の確定／変更')+' <span class="new-mark">未確認 '+items.length+'件</span></h2><p>この日程を基準に、承認・図面／データ完成・材料／金物・配車の段取りを再確認してください。</p>'+(snapshot?.unavailable?'<p class="late" role="status">最新の日程を取得できませんでした。案件データを更新して再確認してください。</p>':'')+items.slice(0,3).map(card).join('')+(items.length>3?'<details data-schedule-priority-more><summary>ほかの日程確定・変更 '+(items.length-3)+'件を確認</summary>'+items.slice(3).map(card).join('')+'</details>':'')+'<p class="small">シート・アプリ共通の変更情報です。入力途中の内容を保存してから「案件データを更新」し、各工程の予定・納期を再確認してください。確認は利用者ごとに記録し、ほかの担当者の確認状態や工程の完了は変えません。</p></section>';

async function confirmSchedulePriority(button){

 try{
  const result=await pwaQueueConfirmation(()=>token===state.token?rpc('markSchedulePriorityRead',state.token,id,fingerprint):null);
  if(token!==state.token||!result?.saved||result.caseId!==id||result.fingerprint!==fingerprint){if(token!==state.token)return;throw Error('確認の保存結果を確認できませんでした');}
  state.confirmed.add(key);cue.saved();
  if(state.snapshot){const items=state.snapshot.items.filter(x=>x.caseId+'|'+x.fingerprint!==key);state.snapshot={...state.snapshot,items,count:items.length};}
  if(data&&!data.adminPreview){const items=(data.schedulePriority?.items||[]).filter(x=>x.caseId+'|'+x.fingerprint!==key);data.schedulePriority={...data.schedulePriority,items,count:items.length};}
 }catch(e){cue.failed();if(token===state.token)state.errors.set(key,'確認を保存できませんでした。'+(e.message||String(e)));}
 finally{state.pending.delete(key);if(token===state.token&&!data?.adminPreview)refreshSchedulePriority();}

let notificationReadSession={token:'',pending:new Map(),confirmed:new Map(),queue:Promise.resolve()};
function notificationReadState(){
  if(notificationReadSession.token!==token)notificationReadSession={token,pending:new Map(),confirmed:new Map(),queue:Promise.resolve()};
  return notificationReadSession;
}
function mergeNotificationSnapshot(snapshot){
  if(!snapshot||data?.adminPreview||previewSelection)return snapshot;
  const state=notificationReadState();
  for(const item of snapshot.items){
    if(!item.unread&&state.pending.has(item.id))state.confirmed.set(item.id,{readAt:item.readAt||''});
  }
  // 保存済みの通知を、並行通信で遅れて届いた未読一覧に戻さない。
  const items=snapshot.items.map(item=>state.confirmed.has(item.id)?{...item,unread:false,readAt:item.readAt||state.confirmed.get(item.id).readAt||''}:item);
  const unread=items.filter(item=>item.unread);
  const read=items.filter(item=>!item.unread).sort((a,b)=>b.at.localeCompare(a.at)||b.id.localeCompare(a.id)).slice(0,50);
  return {...snapshot,items:unread.concat(read),unread:unread.length};
}
function applyNotificationReadResult(state,id,snapshot){
  const saved=snapshot.items.find(item=>item.id===id);
  state.confirmed.set(id,{readAt:saved?.readAt||''});
  if(!data||data.adminPreview||previewSelection)return;
  for(const notice of data.importantNotices||[]){
    notice.targets=notice.targets.map(t=>t.own&&t.notificationId===id?{...t,readAt:saved?.readAt||'確認済み'}:t);
    notice.pending=notice.targets.filter(t=>!t.readAt).length;
  }
  // 応答から保存済みだけを記録し、一覧には現在の画面のデータを使う。
  mergeNotificationSnapshot(snapshot);
  // 既読の保存応答では、受信済みの新着一覧や他の通知の内容を上書きしない。
  const current=data.notifications;
  const items=current.items.filter(item=>item.id!==id||!!saved);
  data.notifications=mergeNotificationSnapshot({...current,items});
}
function updateNotificationReadButtons(){
  const state=notificationReadState();
  document.querySelectorAll('[data-notification-read]').forEach(button=>{
    const pending=state.pending.has(button.dataset.notificationRead);
    button.disabled=busy||!!data?.adminPreview||!!previewSelection||pending;
    button.textContent=pending?'保存中…':'確認しました';
    if(pending)button.setAttribute('aria-busy','true');else button.removeAttribute('aria-busy');
  });
}
function refreshNotificationPanel(){
  updateNotificationBadge();
  const onNotifications=tab==='notifications';
  const panel=onNotifications?$('notification-panel'):(['home','overview'].includes(tab)&&!selected&&role==='CAD'&&data?.user.cadLeader?$('leader-drawing-home'):null);
  if(!panel){updateNotificationReadButtons();return;}
  const opened=Array.from(panel.querySelectorAll('details'),node=>node.open);
  const buttons=Array.from(panel.querySelectorAll('[data-notification-read]'));
  const activeIndex=buttons.indexOf(document.activeElement);
  const activeId=activeIndex>=0?buttons[activeIndex].dataset.notificationRead:'';
  const focusedSummary=panel.contains(document.activeElement)&&document.activeElement?.tagName==='SUMMARY';
  const left=window.scrollX,top=window.scrollY,panelId=panel.id;
  panel.outerHTML=onNotifications?notificationPage():leaderDrawingHome();
  const nextPanel=$(panelId);
  nextPanel.querySelectorAll('details').forEach((node,index)=>node.open=!!opened[index]);
  updateNotificationReadButtons();
  if(activeIndex>=0){
    const nextButtons=Array.from(nextPanel.querySelectorAll('[data-notification-read]'));
    const target=nextButtons.find(button=>button.dataset.notificationRead===activeId)||nextButtons[Math.min(activeIndex,nextButtons.length-1)];
    if(target&&!target.disabled)target.focus({preventScroll:true});
  }else if(focusedSummary)nextPanel.querySelector('summary')?.focus({preventScroll:true});
  window.scrollTo(left,top);
}
async function confirmNotificationRead(button){
  if(!token||busy||!data||data.adminPreview||previewSelection)return;
  const id=button.dataset.notificationRead,state=notificationReadState();
  const item=data.notifications?.items.find(item=>item.id===id);
  if(!item?.unread||state.pending.has(id))return;
  const cue=pwaConfirmationFeedback(button);state.pending.set(id,true);
  updateNotificationReadButtons();
  // 操作は続けて受け付け、GASへの保存要求は一件ずつ送る。
  const save=state.queue.then(async()=>{
    try{
      if(token!==state.token||!data||data.adminPreview||previewSelection||state.confirmed.has(id))return;
      const snapshot=await pwaQueueConfirmation(()=>token===state.token?rpc('markNotificationRead',state.token,id):null);
      if(token!==state.token)return;
      applyNotificationReadResult(state,id,snapshot);cue.saved();
    }catch(error){cue.failed();
      if(token===state.token&&data&&!data.adminPreview&&!previewSelection&&!state.confirmed.has(id))message('確認状態の保存結果を確認できませんでした。もう一度「確認しました」を押してください。 '+(error.message||String(error)));
    }finally{

async function saveAvailabilityForm(form){
  const fields=form.elements,input={};for(const key of ['am','pm','amPlace','amPurpose','pmPlace','pmPurpose','returnMode','returnTime'])input[key]=fields[key].value;
  const date=fields.date.value,version=fields.version.value,alias=data.user.alias;
  availabilitySaveStatus(form,'⏳ '+date+' の予定を保存しています…');
  try{
    let result;
    for(let attempt=0;attempt<20;attempt++){
      result=await rpc('saveSalesAvailability',token,date,input,version,true);
      if(!result?.busy)break;
      availabilitySaveStatus(form,'⏳ ほかの更新処理が終わるのを待っています。入力内容は残っています。');
      if(attempt<19)await new Promise(resolve=>setTimeout(resolve,1500));
    }
    const saved=result?.availability;
    if(!result?.saved||!saved||saved.date!==date||saved.alias!==alias)throw Error('まだ保存できていません。入力内容は残っていますので、少し待ってもう一度保存してください。');
    data.salesAvailability=[...(data.salesAvailability||[]).filter(p=>p.alias!==alias||p.date!==date),saved];
    if(result.salesEveningCheck)data.salesEveningCheck=result.salesEveningCheck;
    availabilityEditorState={alias,date,open:true};
    render();availabilitySaveStatus($('availability-form'),'✓ '+date+' の予定を保存しました。上の予定欄にも反映しました。');
    message('✓ '+date+' の予定を保存し、CAD・管理者と共有しました');
  }catch(error){availabilitySaveStatus(form,'保存できませんでした：'+(error.message||String(error))+' 入力内容は残っています。',true);throw error;}
}

function availabilityFormFill(copy){const f=$('availability-form');if(!f)return;const date=f.elements.date.value,p=(data.salesAvailability||[]).find(p=>p.alias===data.user.alias&&p.date===(copy?data.today:date));if(copy&&!p){message('今日の簡易予定はまだ登録されていません');return;}const target=(data.salesAvailability||[]).find(p=>p.alias===data.user.alias&&p.date===date);f.elements.version.value=target?.version||'';for(const key of ['am','pm','amPlace','amPurpose','pmPlace','pmPurpose','returnMode','returnTime'])f.elements[key].value=p?.[key]||(['am','pm','returnMode'].includes(key)?'未定':'');availabilityFormToggle();if(copy)message('今日の内容を入れました。確認して保存してください');}
function availabilityFormToggle(){const f=$('availability-form');if(!f)return;availabilityDaySelection();for(const key of ['am','pm']){const show=f.elements[key].value==='外出';f.querySelector('[data-availability-outing="'+key+'"]').hidden=!show;}const rest=f.elements.am.value==='休み'&&f.elements.pm.value==='休み';if(rest)f.elements.returnMode.value='休み';else if(f.elements.returnMode.value==='休み')f.elements.returnMode.value='未定';f.elements.returnMode.disabled=rest;const timed=!rest&&f.elements.returnMode.value==='時刻';f.querySelector('[data-availability-time]').hidden=!timed;f.elements.returnTime.required=timed;f.elements.returnTime.disabled=!timed;}

function futureSalesAvailability(people,shared){const availability=shared?.availability||data.salesAvailability||[],plans=shared?.plans||(role==='営業'?(data.salesUpcomingPlans||[]):(data.salesSharedUpcomingPlans||[])),dates=[...new Set([availabilityTomorrow(),...availability.filter(p=>p.date>data.today).map(p=>p.date),...plans.map(p=>p.date)])].sort();return '<details class="future-availability" open><summary>📅 明日以降の営業予定 <span class="pill">'+dates.length+'日</span></summary><p class="small">簡易予定と日時指定の予定をまとめています。未登録は空いているとは限りません。</p>'+dates.map((date,i)=>'<details class="availability-date" '+(i===0?'open':'')+'><summary>'+escape(date)+'（'+['日','月','火','水','木','金','土'][new Date(date+'T00:00:00Z').getUTCDay()]+'）</summary><div class="availability-grid">'+people.map(person=>{const items=plans.filter(p=>p.alias===person.alias&&p.date===date).sort((a,b)=>a.start.localeCompare(b.start)||a.id.localeCompare(b.id));const p=availabilityFromPlans(availability.find(p=>p.alias===person.alias&&p.date===date),items);return '<article class="availability-future-card"><h3>'+escape(person.name)+'さん</h3><div class="availability-halves"><div><span>午前</span>'+availabilitySlot(p,'am')+'</div><div><span>午後</span>'+availabilitySlot(p,'pm')+'</div></div><p class="availability-return">↩ 帰社予定：<strong>'+availabilityReturn(p)+'</strong></p>'+(!p?'<p class="small">簡易予定は未登録です。</p>':'')+(items.length?'<ul class="availability-appointments">'+items.map(x=>'<li><strong>'+escape(x.start+(x.end?'〜'+x.end:''))+'</strong> '+escape(x.place)+'<span class="small"> ／ '+escape(x.purpose)+'</span>'+(isOutingPlan(x)?'<br><span class="small">↩ 帰社予定：'+planReturnLabel(x)+'</span>':'')+'</li>').join('')+'</ul>':'')+'</article>';}).join('')+'</div></details>').join('')+'</details>';}


function scheduleHalfPlans(plans,part){return plans.filter(p=>part==='am'?p.start<'12:00':p.start>='12:00'||(p.returnMode==='時刻'?p.returnTime:p.end||p.start)>'12:00').sort((a,b)=>String(a.start).localeCompare(String(b.start)));}
function compactScheduleSlot(p,part,plans,readOnly){const label=p?.[part],items=scheduleHalfPlans(plans,part);if(label!=='外出')return '<span class="schedule-status">'+(label==='事務所'?'🏢 事務所':label==='休み'?'🌿 休み':'<span title="未登録・未定">？</span>')+'</span>';return '<details class="schedule-outing"><summary>🚗 外出あり</summary><div class="schedule-destination">'+(items.length?planLines(items,readOnly):'<p>'+escape(p[part+'Place']||'行き先未登録')+(p[part+'Purpose']?'<br>'+escape(p[part+'Purpose']):'')+'</p>')+'</div></details>';}
function compactSalesSchedule(people,date,availability,plans,readOnly=true){return '<div class="compact-sales-schedule" role="table" aria-label="午前・午後・帰社時間"><div class="compact-schedule-row compact-schedule-head" role="row"><span role="columnheader">担当</span><span role="columnheader">午前</span><span role="columnheader">午後</span><span role="columnheader">帰社時間</span></div>'+people.map(person=>{const items=plans.filter(p=>p.alias===person.alias&&p.date===date),p=availabilityFromPlans(availability.find(p=>p.alias===person.alias&&p.date===date),items),ret=!p||(!p.returnMode||p.returnMode==='未定')&&!items.some(isOutingPlan)?(p?.am==='事務所'&&p?.pm==='事務所'?'—':'？'):availabilityReturn(p);return '<div class="compact-schedule-row" role="row"><strong role="rowheader">'+escape(person.name)+'さん</strong><div role="cell">'+compactScheduleSlot(p,'am',items,readOnly)+'</div><div role="cell">'+compactScheduleSlot(p,'pm',items,readOnly)+'</div><span role="cell">'+ret+'</span></div>';}).join('')+'</div>';}
function salesMovementMonthPanel(){return '<details class="sales-movement-month"><summary>📖 月ごとの営業の動きを見る</summary><form id="sales-movement-month-form" class="row"><label>表示月<input type="month" name="month" required value="'+escape(data.today.slice(0,7))+'"></label><button class="primary">表示する</button></form><p class="small">必要な月だけ読み込みます。予定と提出済み日報の実績は分けて表示します。</p><div id="sales-movement-month-result" aria-live="polite"></div></details>';}
function renderSalesMovementMonth(d){return '<h3>'+escape(d.month)+' の営業の動き</h3><p class="small">'+(d.actualVisible?'実績は提出済み日報の最新内容です。未提出・未記録の活動は含みません。':'ここでは予定を表示します。日報の実績は本人と管理者が確認できます。')+'</p>'+d.people.map(person=>{const plans=d.plans.filter(p=>p.alias===person.alias),av=d.availability.filter(p=>p.alias===person.alias),reports=d.actual.filter(p=>p.alias===person.alias),dates=[...new Set([...plans,...av,...reports].map(p=>p.date))].sort(),entries=reports.flatMap(p=>p.entries);return '<details class="movement-person"><summary>'+escape(person.name)+'さん ｜ 予定 '+plans.length+'件'+(d.actualVisible?' ／ 実績 '+entries.length+'件（'+reports.length+'日）':'')+'</summary>'+(dates.length?dates.map(date=>'<details><summary>'+escape(date)+'</summary><h4>予定</h4>'+compactSalesSchedule([person],date,av,plans,true)+(plans.length?planLines(plans.filter(p=>p.date===date),true):'')+(d.actualVisible?'<h4>日報の実績</h4>'+((reports.find(p=>p.date===date)?.entries||[]).map(e=>'<p>'+escape(e.start+'〜'+e.end)+' ｜ '+escape(e.category)+' ｜ '+escape(e.place)+' <span class="small">'+escape(e.result)+'</span></p>').join('')||'<p class="small">提出済み日報なし</p>'):'')+'</details>').join(''):'<p>この月の記録はありません。</p>')+'</details>';}).join('');}
document.addEventListener('submit',e=>{if(e.target.getAttribute('id')!=='sales-movement-month-form')return;e.preventDefault();const f=e.target,month=f.elements.month.value,button=f.querySelector('button'),result=$('sales-movement-month-result');button.disabled=true;result.textContent='読み込み中です…';rpc('getSalesMovementMonth',token,month).then(d=>{result.innerHTML=renderSalesMovementMonth(d);}).catch(error=>{result.textContent='読み込めませんでした：'+(error.message||error);}).finally(()=>{button.disabled=false;});});

function salesAvailabilityHome(){if(!['営業','CAD','管理者'].includes(role))return '';const people=role==='営業'?[{alias:data.user.alias,name:data.user.name}]:(data.salesPeople||[]);return '<section class="panel sales-availability" aria-label="営業の居場所と帰社予定"><h2>🗓 今日の営業予定</h2><p class="small">'+escape(data.today)+' ｜ 🚗 外出ありを押すと行き先が開きます。？は未登録・未定です。</p>'+compactSalesSchedule(people,data.today,data.salesAvailability||[],data.salesPlans||[],role!=='営業')+(role==='営業'?availabilityForm():'')+'<details><summary>📅 明日以降の予定を確認</summary>'+futureSalesAvailability(people)+'</details>'+salesMovementMonthPanel()+'</section>';}
document.addEventListener('change',e=>{if(e.target.closest('#availability-form')){if(e.target.name==='date'){availabilityEditorState={alias:data.user.alias,date:e.target.value,open:true};availabilityFormFill(false);}else availabilityFormToggle();}});
document.addEventListener('click',e=>{const day=e.target.closest('[data-availability-day]'),rest=e.target.closest('[data-availability-rest]');if(day){const f=$('availability-form');if(!f)return;const editor=f.closest('.availability-editor');if(editor)editor.open=true;f.elements.date.value=day.dataset.availabilityDay==='today'?data.today:availabilityTomorrow();availabilityEditorState={alias:data.user.alias,date:f.elements.date.value,open:true};availabilityFormFill(false);}if(rest){const f=$('availability-form');f.elements.am.value='休み';f.elements.pm.value='休み';availabilityFormToggle();message('終日休みを入力しました。「予定を保存」で共有してください');}if(e.target.closest('[data-availability-copy]'))availabilityFormFill(true);});

function factoryProgress(p){if(p.source!=='データ')return '—';const f=p.factory,items=f?.items||['横架材','柱材','束材','５軸','羽柄材','合板材'].map(name=>({name,state:'unknown',reason:'最新情報を取得してください'}));return '<div class="factory-progress" aria-label="工場の加工確認"><p class="factory-count">🏭 '+(f?.done===6?'6工程の確認完了':(f?.done||0)+'/6工程 確認完了')+'</p><div class="factory-chips">'+items.map(i=>{const label={done:'✓ 完了',pending:'未完了',unknown:'未確認'}[i.state]||'未確認';return '<span class="factory-chip factory-'+escape(i.state)+'" title="'+escape(i.reason||'')+'">'+escape(i.name)+'：'+label+(i.reason?'<small>'+escape(i.reason)+'</small>':'')+'</span>';}).join('')+'</div></div>';}

function companionPlanList(plans){if(!plans?.length)return '';const open=plans.filter(t=>!t.reviewed),done=plans.filter(t=>t.reviewed);const row=t=>'<article class="'+(t.reviewed?'reviewed-item':'')+'"><strong>'+escape(t.customer+' / '+t.site)+'</strong><p>'+escape(t.title)+'</p>'+(t.reviewed?'<p class="progress-done">✓ 予定確認済み（作業の完了とは別です）</p>':'<button data-plan-reviewed="'+escape(t.key)+'" data-request-id="'+escape(t.response.requestId)+'">予定を確認しました</button>')+' <button data-case="'+escape(t.caseId)+'">対応・登録へ</button></article>';return '<h3>🗓 今日の対応予定 '+open.length+'件</h3>'+open.map(row).join('')+(done.length?'<details><summary>✓ 本日確認した予定 '+done.length+'件</summary>'+done.map(row).join('')+'</details>':'');}
function timberPanel(p){if(p.source!=='データ')return '';const state=p.provisionalTimber,editable=canCAD(p)&&!p.archived;return '<section class="panel"><h3>📋 仮木取表</h3><p>提出期限：<strong>'+escape(p.timberDue||p.timberDueNote||'日程確認が必要')+'</strong>（第一出荷日の5営業日前）</p><p>'+ (p.timberSubmitted?'<span class="progress-done">✓ 提出済 '+escape(state.date)+'</span>':p.timberScheduleChanged?'<span class="pill warn">出荷日変更・提出内容の再確認が必要</span>':'<span class="pill warn">'+escape(state?.status||'未提出・未登録')+'</span>')+'</p>'+(state?'<p class="small">'+escape(state.by)+' ／ '+escape(state.at)+(state.note?'<br>'+escape(state.note):'')+'</p>':'')+(editable?'<form data-timber="'+escape(p.id)+'"><input type="hidden" name="shipping" value="'+escape(p.shipping||'')+'"><label>仮木取表の状況<select name="status"><option '+(!p.timberSubmitted?'selected':'')+'>作成中</option><option '+(p.timberSubmitted?'selected':'')+'>提出済</option></select></label><label>提出日（提出済の場合）<input name="date" type="date" max="'+data.today+'" value="'+escape(p.timberSubmitted?state.date:data.today)+'"></label><label>共有メモ（任意）<input name="note" maxlength="300" value="'+escape(state?.note||'')+'"></label><button class="primary">仮木取表の状況を登録</button></form>':'')+'</section>';}
function timberReminderHome(ps){if(!['CAD','管理者'].includes(role))return '';const items=ps.filter(p=>p.timberReminder).sort((a,b)=>(a.timberDue||'9999').localeCompare(b.timberDue||'9999')),done=ps.filter(p=>p.timberSubmitted&&!p.archived&&!inErectionBucket(p));const row=p=>'<article class="'+(p.timberSubmitted?'reviewed-item':p.timberDue&&p.timberDue<=data.today?'late':'warn')+'"><strong>'+escape(p.customer+' / '+p.site)+'</strong><p>CAD '+escape(p.cad)+' ／ 第一出荷日 '+escape(p.shipping||'未登録')+'<br>仮木取表の提出期限：<strong>'+escape(p.timberDue||p.timberDueNote)+'</strong></p>'+(p.timberSubmitted?'<p class="progress-done">✓ 提出済 '+escape(p.provisionalTimber.date)+'</p>':p.timberScheduleChanged?'<p>⚠ 出荷日変更・提出内容を再確認してください</p>':'<p>'+escape(p.provisionalTimber?.status||'未提出・未登録')+'</p>')+(role==='CAD'?'<button data-case="'+escape(p.id)+'">案件で確認・提出を登録</button>':'')+'</article>';const content='<section class="panel timber-reminders"><h2>📋 仮木取表の提出</h2><p>第一出荷日の1週間前＝<strong>5営業日前（土日・祝日を除く）</strong>までに提出します。</p><p>提出待ち <strong>'+items.length+'件</strong> ／ 本日期限・超過 '+items.filter(p=>p.timberDue&&p.timberDue<=data.today).length+'件</p>'+items.slice(0,3).map(row).join('')+(items.length>3?'<details><summary>ほかの提出待ち '+(items.length-3)+'件</summary>'+items.slice(3).map(row).join('')+'</details>':'')+(!items.length?'<p class="progress-done">✓ 現在の提出待ちはありません。</p>':'')+(done.length?'<details><summary>✓ 提出済み '+done.length+'件</summary>'+done.map(row).join('')+'</details>':'')+'</section>';return role==='CAD'?homeWorkOverview(content,'📋 仮木取表の提出待ち '+items.length+'件 ／ 本日・期限超過 '+items.filter(p=>p.timberDue&&p.timberDue<=data.today).length+'件',items.some(p=>p.timberDue&&p.timberDue<=data.today)):content;}
function notificationItem(x){const pending=notificationReadState().pending.has(x.id);return '<article class="'+(x.unread?'notification-new':'reviewed-item')+'">'+(x.unread?'<span class="new-mark">新着</span>':'<span class="progress-done">✓ 確認済</span>')+'<h3>'+escape(x.subject)+'</h3><p class="small">'+escape(x.at)+' ／ '+(x.mailStatus==='アプリ内通知'?'アプリ内通知':'メール：'+escape(x.mailStatus))+'</p><p class="notification-body">'+escape(x.body)+'</p>'+(!x.unread&&x.readAt?'<p class="small">確認：'+escape(x.readAt)+' ／ '+escape(data.user.name)+'</p>':'')+(x.unread?'<button class="primary" data-notification-read="'+escape(x.id)+'"'+(pending?' disabled aria-busy="true"':'')+'>'+(pending?'保存中…':'確認しました')+'</button>':'')+((x.id?.startsWith('quote-intake:')||x.id?.startsWith('quote-admin-created:'))&&x.caseId&&data.projects?.some(p=>p.id===x.caseId)?'<button type="button" data-case="'+escape(x.caseId)+'">'+(x.id.startsWith('quote-admin-created:')?'登録された案件を開く':'依頼の案件を開く')+'</button>':'')+'</article>';}
function notificationPage(){const scheduleNote=role==='営業'?'<p class="small">担当案件の上棟日・第一出荷日の未確認の変更は、このページの上部で変更前→変更後を確認できます。下の一覧はその他のお知らせです。</p>':'';const n=data.notifications||{unread:0,items:[]},fresh=n.items.filter(x=>x.unread),read=n.items.filter(x=>!x.unread);return '<section id="notification-panel" class="panel">'+scheduleNote+'<h2>🔔 '+(role==='営業'?'その他のお知らせ':'お知らせ')+' <span class="pill">新着 '+n.unread+'件</span></h2><p class="small">確認したお知らせは下の「確認済み」に移ります。メールの送信状況とは別です。</p>'+(!fresh.length?'<p class="progress-done">✓ '+(role==='営業'?'その他の未確認のお知らせ':'未確認のお知らせ')+'はありません。</p>':'')+fresh.map(notificationItem).join('')+(read.length?'<details><summary>✓ 確認済みのお知らせ '+read.length+'件</summary>'+read.map(notificationItem).join('')+'</details>':'')+'</section>';}
document.addEventListener('click',e=>{const b=e.target.closest('[data-plan-reviewed]');if(b)task(async()=>{await rpc('acknowledgeCompanionPlan',token,b.dataset.planReviewed,b.dataset.requestId);await load();message('✓ 予定を確認済みにしました。「本日確認した予定」に移しました');});});

let companionView='pending';
function companionQuickActions(t){return '<div class="row companion-actions"><button type="button" class="primary" data-companion-check="'+escape(t.key)+'" data-fingerprint="'+escape(t.fingerprint)+'" data-request-id="'+encouragementRequestId()+'">✓ 確認しました</button>'+[['plan','📅 対応予定'],['wait','⏳ 返事待ち'],['help','🆘 相談する'],...(t.kind==='question'?[['answer','✉ CADへ回答']]:t.kind==='follow'?[['follow','✓ 対応済みを登録']]:t.kind==='special'?[['material','🪵 特殊材の状況']]:[])].map(([answer,label])=>'<button type="button" data-companion-action="'+answer+'">'+label+'</button>').join('')+'</div>';}
function companionRegistered(c){const entries=new Map();(c.recent||[]).forEach(a=>entries.set(a.key,{key:a.key,caseId:a.caseId,customer:a.customer,site:a.site,title:a.title,response:a}));[...(c.urgent||[]).filter(t=>t.deferred),...(c.waiting||[]),...(c.plans||[])].forEach(t=>entries.set(t.key,t));return [...entries.values()];}
function companionRegisteredCard(t){const a=t.response||{},labels={checked:'✓ 確認済み（本日は非表示）',plan:'📅 対応予定を登録済み',wait:'⏳ 返事待ちを登録済み',help:'🆘 相談済み',follow:'✓ フォロー実施済み',answer:'✉ CADへ回答済み',material:'🪵 特殊材の状況を登録済み'};return '<article class="companion-registered reviewed-item"><span class="companion-state">'+escape(labels[a.answer]||'✓ 登録済み')+'</span><h3>'+escape(t.customer)+' / '+escape(t.site)+'</h3><p>'+escape(t.title)+'</p>'+(a.date&&a.answer!=='checked'?'<p>'+escape(a.answer==='plan'?'対応予定日：':a.answer==='wait'?'次の確認日：':'記録日：')+escape(a.date)+'</p>':'')+(a.note?'<p>'+escape(a.note)+'</p>':'')+(t.reviewed?'<p class="progress-done">✓ 本日確認した予定（作業の完了とは別です）</p>':'')+'<button data-case="'+escape(t.caseId)+'">案件を開く</button></article>';}
function salesCompanionHome(){const c=data.salesCompanion;if(role!=='営業'||!c)return '';const urgent=c.urgent.filter(t=>!t.deferred),registered=companionRegistered(c),pending=urgent.length+c.normal.length;return '<section class="overview-section sales-companion" aria-label="相棒から今日のひと声"><div class="companion-heading">'+caseProgressBird(urgent.length?'waiting':'happy')+'<div><h2>🐤 相棒から、今日のひと声</h2><p class="small">確認・登録したものは未確認の一覧から移動します。確認は作業完了とは別です。</p></div></div><div class="row companion-views"><button type="button" data-companion-view="pending" aria-pressed="'+(companionView==='pending')+'" class="'+(companionView==='pending'?'primary':'')+'">未確認 '+pending+'件</button><button type="button" data-companion-view="registered" aria-pressed="'+(companionView==='registered')+'" class="'+(companionView==='registered'?'primary':'')+'">✓ 確認・登録済み '+registered.length+'件</button></div><div data-companion-pending '+(companionView!=='pending'?'hidden':'')+'>'+(urgent.length?'<h3 class="companion-alert">🔴 急ぎの確認 '+urgent.length+'件</h3>'+urgent.slice(0,3).map(companionCard).join('')+(urgent.length>3?'<details><summary>ほかの急ぎ '+(urgent.length-3)+'件</summary>'+urgent.slice(3).map(companionCard).join('')+'</details>':''):'')+'<h3>今日の確認 '+c.normal.length+'件 <span class="small">／ 本日の通常枠 '+c.assigned+'件・回答／状態更新済み '+c.checked+'件</span></h3><div class="companion-normal">'+c.normal.map(companionCard).join('')+'</div>'+(!pending?'<p class="progress-done">✓ 現在の未確認はありません。お疲れさまでした！</p>':!c.normal.length?'<p class="progress-done">✓ 今日の通常の確認はありません。</p>':'')+'</div><div data-companion-registered '+(companionView!=='registered'?'hidden':'')+'>'+(registered.length?registered.map(companionRegisteredCard).join(''):'<p>確認・登録済みの項目はまだありません。</p>')+'</div><p class="small">通常は1日3件まで。急ぎは別枠。「確認しました」は本日の表示を休みます。翌日・次の確認日・状況が変わったときは再表示します。予定は営業予定に、相談は困りごとに記録します。</p></section>';}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.companionView){companionView=b.dataset.companionView;render();return;}if(b.dataset.companionAction){const f=b.closest('.companion-card')?.querySelector('[data-companion]');if(f){f.elements.answer.value=b.dataset.companionAction;companionFields(f);b.closest('.companion-actions').querySelectorAll('[data-companion-action]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));}return;}if(b.dataset.companionCheck)task(async()=>{const before=data.salesCompanion.normal.length+data.salesCompanion.urgent.filter(t=>!t.deferred).length;const result=await rpc('confirmSalesCompanion',token,b.dataset.companionCheck,b.dataset.fingerprint,b.dataset.requestId);if(!result?.saved||!result.companion)throw Error('確認結果を取得できませんでした。最新情報を取得してください');data.salesCompanion=result.companion;if(result.caseActivity){const p=data.projects.find(p=>p.id===result.caseId);if(p)p.activity=result.caseActivity;}companionView='pending';render();message(result.stillPending?'✓ 確認は保存されました。案件の状況が変わったため、新しい確認が表示されています。':'✓ 確認済みへ移しました。未確認 '+before+'件 → '+result.pending+'件');});});

function salesPlanDayGroups(plans){const groups=new Map();plans.slice().sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start)||a.id.localeCompare(b.id)).forEach(p=>{if(!groups.has(p.date))groups.set(p.date,[]);groups.get(p.date).push(p);});return [...groups].map(([date,items],i)=>'<details class="future-plan-day" '+(i===0?'open':'')+'><summary>'+escape(date)+'（'+new Date(date+'T00:00:00Z').toLocaleDateString('ja-JP',{weekday:'short',timeZone:'UTC'})+'） <span class="pill">'+items.length+'件</span></summary>'+planLines(items)+'</details>').join('');}

ils><summary>🕒 キャンセル・対応の履歴</summary>'+c.history.slice().reverse().map(h=>'<p>'+escape(h.at+' ／ '+h.by)+'<br>'+escape(h.note)+(h.checks?'<br>'+Object.entries(cancelChecks).map(([k,label])=>escape(label+'：'+h.checks[k])).join('<br>'):'')+'</p>').join('')+'</details>'+(!data.adminPreview&&role==='管理者'?'<details><summary>誤登録の場合：キャンセル登録を取り消す</summary><p>元のシート行が残っている場合に利用できます。再開の連絡は各担当者と確認してください。</p><form data-cancel-restore="'+escape(c.id)+'"><label>取消理由<textarea name="reason" required maxlength="500"></textarea></label><button>キャンセル登録を取り消す</button></form></details>':'')+'</article>';return '<h2>📦 受注キャンセル</h2><p>受注後に取り消された案件です。見積の失注と分けて保存します。元の「データ」行を削除しても、この履歴は残ります。</p><div class="stats"><div>対応確認待ち<strong>'+pending.length+'件</strong></div><div>対応確認済み<strong>'+(cs.length-pending.length)+'件</strong></div></div>'+orderCancelForm(null)+pending.map(view).join('')+(cs.some(c=>c.allDone)?'<details><summary>対応確認済みの案件を見る</summary>'+cs.filter(c=>c.allDone).map(view).join('')+'</details>':'')+(!cs.length?'<p>登録済みの受注キャンセルはありません。</p>':'');}

function preventionHome(){const d=data.prevention;if(!d)return '';const ns=d.notices.filter(n=>!n.readAt);if(!ns.length&&!d.pendingReview)return '';return '<section class="panel"><h2>🛡 ミス・再発防止 '+(ns.length?'<span class="new-mark">未読 '+ns.length+'件</span>':'')+'</h2>'+(d.pendingReview?'<p>共有前の報告確認待ち：'+d.pendingReview+'件</p>':'')+ns.slice(0,2).map(n=>preventionNotice(n)).join('')+'<button data-tab="prevention">注意事項・報告一覧を開く</button></section>';}

function preventionPage(){const d=data.prevention||{notices:[],reports:[]};return '<h2>🛡 ミス・再発防止</h2><p>同じミスを防ぐための共有ページです。「読んだ」と「案件で対策を実施した」は別に記録します。</p><p><a href="https://docs.google.com/spreadsheets/d/127YG1FD7Fsr3vD559g9VzqBxy3w11P5ICO0ih6PFE2k/edit#gid=1354497987" target="_blank" rel="noopener">📄 クレーム報告書を開く</a></p><p class="small">報告はこれまでどおりシートで取りまとめます。アプリはシートから読み込みます。二重入力は不要です。「案件データを更新」で最新の内容を取得します。</p>'+(d.sourceHealth?.available===false?'<p class="late">シートの報告を読み込めていません。管理者に確認してください。</p>':d.canReview?'<p class="small">シートから取得：'+d.sourceHealth.count+'件 ／ '+escape(d.sourceHealth.checkedAt)+(d.sourceHealth.error?'<br>'+escape(d.sourceHealth.error):'')+'</p>':'')+'<div class="stats"><div>共有中<strong>'+d.notices.length+'件</strong></div><div>お知らせ未読<strong>'+(d.unread||0)+'件</strong></div>'+(d.canReview?'<div>共有前の報告確認待ち<strong>'+d.pendingReview+'件</strong></div>':'')+'</div><h3>📢 共有中の注意事項</h3>'+preventionNoticeGroups(d.notices)+(!d.notices.length?'<p>現在、対象の注意事項はありません。</p>':'')+'<h3>'+(d.canReview?'📋 シートの報告・対策管理':'📋 以前のアプリ報告')+'</h3><p class="small">分類は多い順です。配送・積込は配達ミス、指示・発注・打合せ等はその他に集計します。複数分類の報告は、それぞれに1件ずつ数えます。</p>'+preventionReportGroups(d)+(!d.reports.length&&d.canReview?'<p>読み込まれた報告はありません。</p>':'');}


function preventionReportRow(r,d){return '<details class="panel"><summary>'+escape(r.customer)+' / '+escape(r.site||'現場未記入')+' — '+escape(r.sourceChanged?'シート変更・再確認待ち':r.publication?r.publication.status:'確認待ち')+'</summary><p>'+escape(r.date)+' ／ 報告：'+escape(r.by)+'<br>分類：'+escape(r.categories.join('・'))+'</p><p class="notification-body">'+escape(r.content)+'</p><p>対応：'+escape(r.responses.join('・'))+'<br>'+escape(r.responseNote||'')+'<br>担当：'+escape(r.person||'未記入')+'</p><p class="notification-body">解決策・対策案：'+escape(r.solution||'未記入')+'</p><p class="pill">'+escape(r.publication?(r.publication.active?r.publication.status+'・共有中':'掲示終了'):'共有前・確認待ち')+'</p>'+(!data.adminPreview&&d.canReview?preventionReviewForm(r):'')+'<details><summary>記録・対策の履歴</summary><p>'+escape(r.at+' ／ '+r.by+' が報告')+'</p>'+r.history.slice().reverse().map(h=>'<p>'+escape(h.at+' ／ '+h.by+' ／ '+h.status+(h.active?'・掲示':'・掲示終了'))+'<br>'+escape(h.action)+'<br>'+escape(h.note||'')+'</p>').join('')+'</details></details>';}
function preventionCustomerKey(name){return String(name||'受注先未記入').normalize('NFKC').trim()||'受注先未記入';}
function preventionCustomerGroups(items,key){const groups=new Map();items.forEach(item=>{const label=key(item),k=preventionCustomerKey(label);if(!groups.has(k))groups.set(k,{key:k,label:String(label||'受注先未記入').trim()||'受注先未記入',items:[]});groups.get(k).items.push(item);});return [...groups.values()].sort((a,b)=>a.key.localeCompare(b.key,'ja',{numeric:true}));}
function preventionReportDate(r){const m=String(r.date||'').match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})$/);return m?m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0'):'';}
function preventionReportGroups(d){return preventionCustomerGroups(d.reports,r=>r.customer).map(g=>{const pending=g.items.filter(r=>!r.publication||r.sourceChanged).length;const rows=g.items.slice().sort((a,b)=>preventionReportDate(b).localeCompare(preventionReportDate(a))||b.at.localeCompare(a.at));return '<details class="panel prevention-customer prevention-report-group"><summary>🏢 '+escape(g.label)+' <span class="pill">'+rows.length+'件</span>'+(pending?' <span class="small">確認待ち '+pending+'件</span>':'')+preventionCategoryHeading(rows)+'</summary><p class="small">新しい発生日から表示します。</p>'+rows.map(r=>preventionReportRow(r,d)).join('')+'</details>';}).join('');}
function preventionNoticeGroups(notices){return preventionCustomerGroups(notices,n=>n.scope==='全体共通'?'全体共通':n.customer).sort((a,b)=>Number(b.key==='全体共通')-Number(a.key==='全体共通')||a.key.localeCompare(b.key,'ja')).map(g=>'<details class="panel prevention-customer" '+(g.items.some(n=>!n.readAt)?'open':'')+'><summary>'+(g.key==='全体共通'?'📢 ':'🏢 ')+escape(g.label)+' <span class="pill">'+g.items.length+'件</span></summary>'+g.items.map(n=>preventionNotice(n)).join('')+'</details>').join('');}


function preventionCategoryCounts(reports){const labels=['データミス','加工ミス','配達ミス','その他'],counts=Object.fromEntries(labels.map(k=>[k,0]));reports.forEach(r=>{const kinds=new Set();(r.categories?.length?r.categories:['その他']).forEach(raw=>{const text=String(raw).normalize('NFKC');let matched=false;if(/データ/.test(text)){kinds.add('データミス');matched=true;}if(/加工|機械/.test(text)){kinds.add('加工ミス');matched=true;}if(/配達|配送|積込|積み込/.test(text)){kinds.add('配達ミス');matched=true;}if(!matched)kinds.add('その他');});kinds.forEach(k=>counts[k]++);});return labels.map((label,index)=>({label,count:counts[label],index})).sort((a,b)=>b.count-a.count||a.index-b.index);}
function preventionCategoryHeading(reports){return '<span class="prevention-categories" aria-label="ミス分類別の件数">'+preventionCategoryCounts(reports).map(c=>'<span class="pill '+(c.count?'':'prevention-category-zero')+'">'+escape(c.label)+' '+c.count+'件</span>').join('')+'</span>';}


function customerMistakeHistory(p,full=false){const h=(data.customerMistakeHistory||[]).find(h=>h.customer===preventionCustomerKey(p.customer));if(!h)return '';const kinds=h.kinds.slice(0,2).map(c=>escape(c.label)+' '+c.count+'件').join('・'),examples=h.recent.slice(0,full?2:1);return '<aside class="customer-mistake-history" aria-label="同じ受注先の過去の注意"><strong>⚠ 過去の注意：'+kinds+'</strong><span class="small">（報告 '+h.total+'件）</span>'+examples.map(e=>'<p>'+escape(e.date)+' の事例：'+escape(e.excerpt)+'</p>').join('')+(full?'<p class="small">同じ受注先の過去の報告から抜粋しています。次回の対策は、共有済みの注意事項も確認してください。</p>':'')+'</aside>';}

function salesMonthlyPage(){const m=salesMonthlyState||data.monthlyPerformance;return '<h2>🏆 営業の月間成績</h2><form id="sales-month-form" class="row"><label>集計月<input name="month" type="month" required value="'+escape(m?.month||data.today.slice(0,7))+'"></label><button>この月を表示</button></form>'+monthlyPerformanceHome(true,m);}
function cadCompletedAreaHome(m=data.cadMonthly){
 if(role!=='CAD'||!m)return '';
 const person=m.people.find(p=>p.alias===data.user.alias),items=(person?.pending||[]).filter(w=>w.kind==='見積'&&!(Number(w.area)>0)&&w.date);if(!items.length)return '';
 return '<section class="panel warn cad-completed-area-home" aria-label="完了済み案件の坪数入力"><h2>📐 完了済み案件の坪数を入力してください <span class="pill">'+items.length+'件</span></h2><p>入力完了の報告は済んでいますが、坪数が未入力のため実績へ加算できていません。確認した坪数を入力してください。完了報告の押し直しは不要です。</p>'+items.map(w=>{const request=(person.areaRequests||[]).find(r=>r.caseId===w.caseId&&Number(r.quoteVersion)===Number(w.version));return '<article><h3>'+escape(w.customer+' ／ '+w.site)+'</h3><p>登録済みの入力完了日：'+escape(w.date)+' ／ 入力後はこの完了日の月へ計上します。</p>'+(request?.editable&&!data.adminPreview?'<form data-cad-sheet-area="'+escape(w.caseId)+'"><input type="hidden" name="expectedArea" value="'+escape(request.expectedArea)+'"><input type="hidden" name="quoteVersion" value="'+escape(request.quoteVersion)+'"><label>確認した坪数<input name="area" type="number" min="0.01" step="any" required></label><button class="primary">坪数を保存して実績に反映</button></form>':'<p class="small">本人のCAD画面、またはCAD月間実績の不足情報の入力欄から登録してください。</p>')+'</article>';}).join('')+'</section>';
}
function cadAreaInputReminder(m){const admin=role==='管理者',people=m.people.filter(p=>p.areaRequests?.length),count=people.reduce((n,p)=>n+p.areaRequests.length,0);if(!count)return '';return '<section class="panel warn cad-area-input-reminder"><h3>📐 '+(admin?'坪数未入力・集計に不足あり：':'坪数を入力してください：')+count+'件</h3><p>'+(admin?'担当者別に、坪数不足で集計できていない案件を確認できます。入力は担当CADが行います。':'アプリの入力欄、または下記のシートへ坪数を入力してください。シートで入力した場合は「案件データを更新」を押すと案内から外れます。どちらも同じ坪数を使い、完成日は変更しません。')+'</p>'+people.map(p=>'<details><summary>'+escape(p.name)+'さん：'+p.areaRequests.length+'件'+(admin?'の未入力案件を見る':'の入力先を見る')+'</summary>'+p.areaRequests.map(w=>'<p><strong>'+escape(w.customer+' ／ '+w.site)+'</strong><br>'+escape(w.location)+(admin?'：坪数未入力・要確認':'へ坪数を入力してください。')+'</p>'+(role==='CAD'&&w.editable?'<form data-cad-sheet-area="'+escape(w.caseId)+'"><input type="hidden" name="expectedArea" value="'+escape(w.expectedArea)+'"><input type="hidden" name="quoteVersion" value="'+escape(w.quoteVersion??'')+'"><label>坪数<input name="area" type="number" min="0.01" step="any" required></label><button class="primary">坪数を保存してシートへ反映</button></form>':'')).join('')+'</details>').join('')+'</section>';}
function homeWorkOverview(content,label,urgent=false){return '<details class="home-work-overview" '+(urgent?'open':'')+'><summary>'+escape(label)+(urgent?' 🔴 優先して確認':' · 詳細を見る')+'</summary>'+content+'</details>';}
function businessDigestVisible(){return (role==='管理者'||role==='CAD'&&data?.user?.cadLeader)&&!data?.adminPreview;}
function adminDigestHome(){const d=data.adminDigest;if(!businessDigestVisible()||!d)return '';if(d.unavailable)return '<section class="panel warn admin-digest-home"><h2>📰 業務更新ダイジェスト</h2><p>更新内容を取得できませんでした。案件データを更新して再確認してください。各画面の案件・集計は引き続き確認できます。</p></section>';const items=d.items||[],row=x=>'<article class="admin-digest-card"><span class="pill">'+escape(x.category)+'</span><h3>'+escape(x.title)+'</h3><p class="small">'+escape(x.lines.slice(0,2).join(' ／ '))+'</p><button type="button" data-admin-digest="'+escape(x.id)+'">更新内容を開いて確認</button></article>';return '<section class="panel admin-digest-home" aria-label="業務更新ダイジェスト"><h2>📰 前回確認後の更新 <span class="pill">未確認 '+items.length+'件</span></h2><p class="small">同じ案件の更新は1件にまとめます。内容を開くと確認済みになり、この一覧から消えます。確認は利用者ごとに記録し、元の業務記録は各画面に残ります。</p>'+(d.initial?'<p>今回の状態を基準にしました。次回以降の更新をここへ表示します。</p>':'')+(!items.length?'<p class="progress-done">✓ 現在、未確認の更新はありません。</p>':items.slice(0,5).map(row).join('')+(items.length>5?'<details><summary>ほかの更新 '+(items.length-5)+'件を見る</summary>'+items.slice(5).map(row).join('')+'</details>':''))+'</section>';}
let adminDigestSaving=new Set();
function applyAdminDigestReadResult(result,expectedToken){if(token!==expectedToken||!businessDigestVisible()||!result?.saved||!data?.adminDigest)return false;data.adminDigest.items=data.adminDigest.items.filter(x=>x.id!==result.id||x.fingerprint!==result.fingerprint);render();return true;}
async function openAdminDigest(id){
  if(!businessDigestVisible())return;const item=data.adminDigest?.items.find(x=>x.id===id);if(!item)return;const dialog=$('admin-digest-dialog'),expectedToken=token;
  dialog.dataset.id=id;dialog.dataset.fingerprint=item.fingerprint;dialog.innerHTML='<button type="button" data-admin-digest-close>閉じる</button><h2>'+escape(item.category)+'：'+escape(item.title)+'</h2><p class="small">直近の「案件データを更新」で取得した状況です。営業予定や進捗などの元記録は各画面で確認できます。</p><ul class="admin-digest-lines">'+item.lines.filter(Boolean).map(line=>'<li>'+escape(line)+'</li>').join('')+'</ul><p class="admin-digest-status" role="status">確認済みの記録を保存しています…</p>';
  dialog.showModal();if(adminDigestSaving.has(id))return;adminDigestSaving.add(id);
  try{const result=await rpc('markAdminDigestRead',expectedToken,id,item.fingerprint);if(!result?.saved)throw Error('確認の保存を確認できませんでした');if(!applyAdminDigestReadResult(result,expectedToken))return;if(dialog.dataset.id===id&&dialog.dataset.fingerprint===item.fingerprint)dialog.querySelector('[role=status]').textContent='✓ 確認済みとして保存しました。ホームの未確認一覧から外しました。';}
  catch(e){if(token!==expectedToken)return;if(dialog.dataset.id===id&&dialog.dataset.fingerprint===item.fingerprint){dialog.querySelector('[role=status]').textContent='確認を保存できませんでした。未確認一覧に残しています。'+(e.message||String(e));const retry=document.createElement('button');retry.type='button';retry.dataset.adminDigestRetry=id;retry.textContent='確認の保存を再試行';dialog.appendChild(retry);}if(typeof showAppError==='function')showAppError(e,'更新内容の確認を保存');}
  finally{adminDigestSaving.delete(id);}
}
document.addEventListener('click',e=>{const close=e.target.closest('[data-admin-digest-close]');if(close){$('admin-digest-dialog').close();return;}const retry=e.target.closest('[data-admin-digest-retry]');if(retry){$('admin-digest-dialog').close();void openAdminDigest(retry.dataset.adminDigestRetry);return;}const b=e.target.closest('[data-admin-digest]');if(b)void openAdminDigest(b.dataset.adminDigest);});

<dialog id="app-error-dialog" role="alertdialog" aria-modal="true" aria-labelledby="app-error-title" aria-describedby="app-error-operation app-error-detail">
  <h2 id="app-error-title"><span class="error-icon" aria-hidden="true">!</span>エラーが発生しました</h2>
  <p id="app-error-operation"></p>
  <pre id="app-error-detail"></pre>
  <p>入力途中の画面は、閉じたり再読み込みしたりせずに内容をご確認ください。</p>
  <p id="app-error-copy-status" role="status" aria-live="polite"></p>
  <div class="error-actions"><button type="button" data-app-error-copy>エラー内容をコピー</button><button type="button" class="error-confirm" data-app-error-close autofocus>内容を確認して閉じる</button></div>
</dialog>
<script>
function showAppError(error, operation = '操作の結果をご確認ください') {
  const dialog = $('app-error-dialog');
  const detail = error?.message || String(error || '処理を完了できませんでした');
  message('');
  $('app-error-operation').textContent = operation;
  $('app-error-detail').textContent = detail;
  $('app-error-copy-status').textContent = '';
  if (!dialog.open) dialog.showModal();
}
document.addEventListener('click', async e => {
  if (e.target.closest('[data-app-error-close]')) {
    e.preventDefault(); e.stopImmediatePropagation();
    $('app-error-dialog').close();
    return;
  }
  if (e.target.closest('[data-app-error-copy]')) {
    e.preventDefault(); e.stopImmediatePropagation();
    const content = $('app-error-operation').textContent + '\n' + $('app-error-detail').textContent;
    try {
      await navigator.clipboard.writeText(content);
      $('app-error-copy-status').textContent = 'エラー内容をコピーしました。';
    } catch (error) {
      $('app-error-copy-status').textContent = 'コピーできませんでした。上のエラー内容を選択してコピーしてください。';
    }
  }
}, true);
</script>
