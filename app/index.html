</style>
<style>
  .quote-event {
    overflow-wrap: anywhere;
  }
  .quote-draft input {
    box-sizing: border-box;
    width: 100%;
  }
</style>
<dialog id="quote-dialog" aria-labelledby="quote-dialog-title"></dialog>
<script>
  const quoteWorkspace = (() => {
    let context = '',
      model = null,
      error = '',
      loading = false,
      busy = false,
      range = '',
      calendarMode = 'week',
      loadedWindow = '',
      search = '',
      status = '',
      ordered = false,
      draft = null;
    const dialog = document.getElementById('quote-dialog');
    const esc = (v) => escape(String(v ?? ''));
    const addDays = (d, n) =>
      new Date(new Date(d + 'T00:00:00Z').getTime() + n * 86400000).toISOString().slice(0, 10);
    const monthStart = (day, offset = 0) => {
      const date = new Date(day.slice(0, 7) + '-01T00:00:00Z');
      date.setUTCMonth(date.getUTCMonth() + offset);
      return date.toISOString().slice(0, 10);
    };
    const calendarWindow = () =>
      calendarMode === 'month' ? [monthStart(range), monthStart(range, 1)] : [range, addDays(range, 7)];
    const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
    const localDate = (d) =>
      new Intl.DateTimeFormat('sv-SE', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      }).format(new Date(d));
    const localTime = (d) =>
      new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false,
      }).format(new Date(d));
    const datetime = (d) => localDate(d) + 'T' + localTime(d);
    const key = () => token + '|' + role + '|' + (previewSelection?.alias || '');
    const redraw = () => {
      if (tab === 'quotes')
        $('content').innerHTML =
          (typeof salesQuoteEntryPanel === 'function' ? salesQuoteEntryPanel() : '') + view();
    };
    const row = (id) => model?.rows.find((q) => q.id === id);
    const button = (action, label, id = '', extra = '') =>
      '<button type="button" data-q="' +
      action +
      '" data-q-id="' +
      esc(id) +
      '" ' +
      extra +
      '>' +
      label +
      '</button>';
    const title = (q) =>
      q.fields.builder + ' / ' + q.fields.site + '（プラン' + (q.plan || '未確認') + '）';
    const dateLabel = (v) =>
      /^\d{4}-\d\d-\d\d$/.test(v || '') ? v : v ? esc(v) + '（要確認）' : '未定';
    const fieldNames = {
      receivedOn: '受付日',
      receiver: '受付者',
      salesCode: '営業担当',
      secondarySales: 'S営業',
      ordered: '受注状況',
      period: '期',
      number: '物件番号',
      cadCode: 'CAD担当',
      newCustomer: '新規',
      companyPrefix: '法人区分',
      builder: '工務店名',
      site: '現場名',
      specification: '仕様',
      plan: 'プラン',
      area: '坪数',
      deadline: '見積期限',
      drawingOn: '図面入力日',
      completedOn: '見積完了',
      amount: '見積金額',
      raisingOn: '上棟予定日',
      notes: '備考',
    };
    const fixed = (q) =>
      q.calendar?.deleted
        ? 'Googleで削除済み'
        : q.calendar?.pending
          ? '登録結果を確認中'
          : q.calendar?.fixed
            ? '手動・固定'
            : q.calendar
              ? '自動配置済み'
              : '未配置';
    async function refresh() {
      const own = key();
      if (loading) return;
      loading = true;
      error = '';
      if (!range) range = data.today;
      const bounds = calendarWindow();
      const requestedWindow = bounds.join();
      const isCurrent = () => own === key() && requestedWindow === calendarWindow().join();
      try {
        const result = await rpc('getQuoteWorkspace', token, ...bounds);
        if (isCurrent()) {
          model = result;
          context = own;
          loadedWindow = requestedWindow;
        }
      } catch (e) {
        if (isCurrent()) error = e.message || String(e);
      } finally {
        loading = false;
        if (isCurrent()) redraw();
        else queueMicrotask(refresh);
      }
    }
    function view() {
      if (context !== key()) {
        context = key();
        model = null;
        error = '';
        range = data.today;
        calendarMode = 'week';
        loadedWindow = '';
        queueMicrotask(refresh);
      }
      if (!model)
        return (
          '<section class="quote-workspace"><h2>見積用</h2>' +
          (error
            ? '<p class="quote-error">' + esc(error) + '</p>' + button('refresh', '読み直す')
            : '<p>見積受付を読み込んでいます…</p>') +
          '</section>'
        );
      if (!model.enabled)
        return typeof legacyQuotePage === 'function'
          ? legacyQuotePage(visible())
          : '<section class="quote-workspace"><h2>見積用</h2><p>' +
              esc(model.message) +
              '</p><button data-tab="cases">案件を開く</button></section>';
      const rows = model.rows
        .filter(
          (q) =>
            (ordered || !q.fields.ordered) &&
            (!status || q.status === status) &&
            (!search ||
              (q.fields.builder + ' ' + q.fields.site + ' ' + q.cad)
                .toLowerCase()
                .includes(search.toLowerCase())),
        )
        .sort((a, b) => (a.fields.deadline || '9999').localeCompare(b.fields.deadline || '9999'));
      const [from, to] = calendarWindow();
      const month = calendarMode === 'month';
      const period = month ? '月' : '週';
      const hasCalendarData = loadedWindow === [from, to].join();
      const days = (new Date(to) - new Date(from)) / 86400000;
      const leading = month ? (new Date(from).getUTCDay() + 6) % 7 : 0;
      const scheduledRows = hasCalendarData ? model.rows : [];
      const calendarEvents = hasCalendarData ? model.events : [];
      return (
        '<section class="quote-workspace"><div class="quote-top"><div><h2>見積用</h2><p class="quote-hint">受付から図面入力・完了まで。Excelの反映状況もここで確認できます。</p></div><div class="quote-controls">' +
        button('refresh', loading ? '更新中…' : '更新', '', loading ? 'disabled' : '') +
        (!model.preview
          ? (role !== '管理者' ? button('new', '＋ 新規受付', '', 'class="primary"') : '')
          : '<span class="quote-badge">閲覧専用</span>') +
        '</div></div>' +
        (error ? '<p class="quote-error" role="alert">' + esc(error) + '</p>' : '') +
        '<div class="quote-stats">' +
        ['受付済み', '図面入力完了', 'すべて完了']
          .map(
            (s) =>
              '<span>' +
              s +
              ' <strong>' +
              model.rows.filter((q) => q.status === s && !q.fields.ordered).length +
              '</strong></span>',
          )
          .join('') +
        '</div>' +
        '<div class="quote-controls"><input aria-label="工務店・現場・担当を検索" id="quote-search" placeholder="工務店・現場・担当で検索" value="' +
        esc(search) +
        '"><select id="quote-status" aria-label="進捗で絞り込み"><option value="">すべての進捗</option>' +
        ['受付済み', '図面入力完了', 'すべて完了']
          .map((s) => '<option ' + (status === s ? 'selected' : '') + '>' + s + '</option>')
          .join('') +
        '</select><label><input type="checkbox" id="quote-ordered" ' +
        (ordered ? 'checked' : '') +
        '>受注済みも表示</label></div>' +
        '<div class="quote-table-wrap"><table class="quote-table"><thead><tr><th>受付・現場</th><th>プラン</th><th>見積期限</th><th>CAD・進捗</th><th>Excel</th><th>予定</th><th>操作</th></tr></thead><tbody>' +
        rows
          .map(
            (q) =>
              '<tr><td><strong>' +
              esc(q.fields.builder) +
              '</strong><br>' +
              esc(q.fields.site) +
              '<div class="quote-hint">' +
              esc(q.fields.receivedOn) +
              ' ' +
              esc(q.fields.period) +
              (q.fields.number ? ' / ' + esc(q.fields.number) : '') +
              '</div></td><td>プラン' +
              (q.plan || '要確認') +
              '</td><td>' +
              dateLabel(q.fields.deadline) +
              (q.fields.deadline < model.today && q.status !== 'すべて完了'
                ? '<p class="quote-warning">期限を確認</p>'
                : '') +
              '</td><td>' +
              esc(q.cad) +
              '<br><span class="quote-badge ' +
              (q.status === 'すべて完了' ? 'done' : '') +
              '">' +
              q.status +
              '</span></td><td><span class="quote-badge ' +
              (q.sync === '同期済み' ? '' : 'warn') +
              '">' +
              esc(q.sync) +
              '</span>' +
              (q.canEdit && Object.keys(q.conflicts).length
                ? '<br>' + button('conflict', '内容を確認', q.id)
                : '') +
              '</td><td>' +
              (q.calendar && !q.calendar.deleted
                ? esc(localDate(q.calendar.start)) +
                  '<br>' +
                  esc(localTime(q.calendar.start)) +
                  '～' +
                  esc(localTime(q.calendar.end)) +
                  '<br>'
                : '') +
              '<span class="quote-badge ' +
              (q.calendar?.fixed ? 'fixed' : '') +
              '">' +
              fixed(q) +
              '</span>' +
              (q.calendar &&
              !q.calendar.deleted &&
              q.fields.deadline &&
              localDate(q.calendar.end) > q.fields.deadline
                ? '<p class="quote-warning">予定が提出期限を超えています</p>'
                : '') +
              '</td><td>' +
              button('edit', q.canEdit ? '開く・変更' : '詳細', q.id) +
              (q.canEdit && model.calendarReady
                ? '<br>' +
                  button(
                    'schedule',
                    q.calendar && !q.calendar.deleted ? '予定を変更' : '予定を追加',
                    q.id,
                  )
                : '') +
              '</td></tr>',
          )
          .join('') +
        '</tbody></table>' +
        (!rows.length ? '<p class="quote-empty">表示する受付はありません。</p>' : '') +
        '</div>' +
        '<div class="quote-top"><div><h3>見積の作業予定</h3><p class="quote-hint">' +
        (model.sheetsOnly
          ? 'シートに記録された見積予定を表示しています。'
          : '手で動かした予定は固定。自動配置は未配置の物件だけです。約1分ごとにGoogleの変更を読み込みます。') +
        '</p></div>' +
        (hasCalendarData && !model.preview && model.planReady
          ? button('plan', '未配置の予定案を作る')
          : '') +
        '</div>' +
        (model.calendarError
          ? '<p class="quote-error">' + esc(model.calendarError) + '</p>'
          : !model.calendarReady && !model.sheetsOnly
            ? '<p class="quote-hint">Googleカレンダーの接続待ちです。</p>'
            : '') +
        '<div class="quote-controls">' +
        button('week', '週', '', 'aria-pressed="' + String(!month) + '"') +
        button('month', '月', '', 'aria-pressed="' + String(month) + '"') +
        button('previous', '← 前の' + period) +
        '<input type="' +
        (month ? 'month' : 'date') +
        '" id="quote-range" aria-label="カレンダーの表示' +
        (month ? '月' : '開始日') +
        '" value="' +
        esc(month ? range.slice(0, 7) : range) +
        '">' +
        button('next', '次の' + period + ' →') +
        '</div>' +
        (!hasCalendarData && !error
          ? '<p class="quote-hint" role="status">予定を読み込んでいます…</p>'
          : '') +
        '<div class="quote-calendar-wrap"><div class="quote-calendar' +
        (month ? ' month' : '') +
        '">' +
        '<div aria-hidden="true"></div>'.repeat(leading) +
        Array.from({ length: days }, (_, i) => {
          const day = addDays(from, i),
            dayRows = scheduledRows
              .filter(
                (q) => q.calendar && !q.calendar.deleted && localDate(q.calendar.start) === day,
              )
              .sort((a, b) => new Date(a.calendar.start) - new Date(b.calendar.start));
          const other = calendarEvents.filter(
            (e) =>
              e.busy &&
              localDate(e.start) <= day &&
              new Date(e.end) > new Date(day + 'T00:00:00+09:00') &&
              !model.rows.some((q) => q.calendar?.id === e.id),
          );
          return (
            '<div class="quote-day"><time datetime="' +
            day +
            '">' +
            day.slice(5) +
            ' ' +
            weekdays[new Date(day).getUTCDay()] +
            '</time>' +
            dayRows
              .map((q) =>
                button(
                  'schedule',
                  esc(localTime(q.calendar.start)) +
                    '～' +
                    esc(localTime(q.calendar.end)) +
                    '<br>' +
                    esc(q.fields.builder) +
                    '<br>' +
                    esc(q.fields.site) +
                    ' / プラン' +
                    (q.plan || '?') +
                    '<br>' +
                    fixed(q),
                  q.id,
                  'class="quote-event"',
                ),
              )
              .join('') +
            other
              .map(
                (e) =>
                  '<div class="quote-busy">別の予定 ' +
                  esc(localTime(e.start)) +
                  '～' +
                  esc(localTime(e.end)) +
                  '</div>',
              )
              .join('') +
            '</div>'
          );
        }).join('') +
        '</div></div></section>'
      );
    }
    function open(content) {
      dialog.innerHTML = content;
      dialog.showModal();
    }
    function form(titleText, body, action, id = '', revision = '') {
      return (
        '<form id="quote-form" data-action="' +
        action +
        '" data-id="' +
        esc(id) +
        '" data-revision="' +
        revision +
        '"><h2 id="quote-dialog-title">' +
        esc(titleText) +
        '</h2>' +
        body +
        '<p class="quote-form-error" role="alert"></p><div class="quote-form-actions">' +
        button('close', '閉じる') +
        (action
          ? '<button class="primary" type="submit">' +
            (action === 'apply' ? 'この予定案を登録' : '保存') +
            '</button>'
          : '') +
        '</div></form>'
      );
    }
    function options(items, value) {
      return (
        '<option value="">未割当</option>' +
        (!items.some((x) => x.code === value) && value
          ? '<option selected value="' + esc(value) + '">コード ' + esc(value) + '</option>'
          : '') +
        items
          .map(
            (x) =>
              '<option value="' +
              esc(x.code) +
              '" ' +
              (x.code === value ? 'selected' : '') +
              '>' +
              esc(x.alias) +
              '（' +
              esc(x.code) +
              '）</option>',
          )
          .join('')
      );
    }
    function edit(q) {
      const f = q?.fields || {},
        read = q && !q.canEdit;
      open(
        form(
          q ? '見積受付の内容' : '新規受付',
          '<fieldset ' +
            (read ? 'disabled' : '') +
            ' style="border:0;padding:0"><div class="quote-form-grid">' +
            '<label>工務店名<input name="builder" required maxlength="200" value="' +
            esc(f.builder) +
            '"></label><label>現場名<input name="site" required maxlength="200" value="' +
            esc(f.site) +
            '"></label>' +
            '<label>見積提出期限<input type="date" name="deadline" ' +
            (!q ? 'required' : '') +
            ' value="' +
            (/^\d{4}-\d\d-\d\d$/.test(f.deadline || '') ? f.deadline : '') +
            '">' +
            (q && f.deadline && !/^\d{4}-\d\d-\d\d$/.test(f.deadline)
              ? '<span class="quote-warning">Excelの原文：' +
                esc(f.deadline) +
                '。確定日を入力すると変更されます。</span>'
              : '') +
            '</label>' +
            '<label>プラン番号<input type="number" name="plan" min="1" max="99" ' +
            (!q ? 'required' : '') +
            ' value="' +
            (q ? q.plan || '' : 1) +
            '"></label><label>CAD担当<select name="cadCode">' +
            options(model.cadCodes, f.cadCode) +
            '</select></label><label>営業担当<select name="salesCode">' +
            options(model.salesCodes, f.salesCode) +
            '</select></label>' +
            '<label>進捗<select name="status">' +
            ['受付済み', '図面入力完了', 'すべて完了']
              .map((s) => '<option ' + (q?.status === s ? 'selected' : '') + '>' + s + '</option>')
              .join('') +
            '</select></label><label>坪数<input name="area" maxlength="200" value="' +
            esc(f.area) +
            '"></label><label class="quote-form-wide">仕様<input name="specification" maxlength="200" value="' +
            esc(f.specification) +
            '"></label><label class="quote-form-wide">備考<textarea name="notes" maxlength="2000">' +
            esc(f.notes) +
            '</textarea></label>' +
            '<label class="quote-form-wide">図面（1ファイル10MBまで）<input type="file" name="drawings" multiple ' +
            (!model.drawingReady ? 'disabled' : '') +
            '>' +
            (!model.drawingReady
              ? '<span class="quote-hint">図面保存先の設定待ちです。</span>'
              : '') +
            '</label></div></fieldset>' +
            (q?.attachments.length
              ? '<p>添付図面</p>' +
                q.attachments
                  .map((a) =>
                    button('download', esc(a.name), q.id, 'data-attachment="' + esc(a.id) + '"'),
                  )
                  .join('')
              : '') +
            '<p class="quote-hint">保存すると受付一覧へ反映します。ExcelはPC側の同期後に「同期済み」になります。</p>',
          read ? '' : q ? 'edit' : 'new',
          q?.id || '',
          q?.rev || '',
        ),
      );
      if (!q) dialog.querySelector('form').dataset.requestId = crypto.randomUUID();
    }
    function schedule(q) {
      if (!q) return;
      const cal = q.calendar && !q.calendar.deleted ? q.calendar : null,
        day = cal ? localDate(cal.start) : model.today;
      open(
        form(
          '作業予定：' + q.fields.site,
          '<p>' +
            esc(title(q)) +
            '</p><div class="quote-form-grid"><label>開始<input type="datetime-local" name="start" required value="' +
            (cal ? datetime(cal.start) : day + 'T09:00') +
            '" ' +
            (!q.canEdit ? 'disabled' : '') +
            '></label><label>終了<input type="datetime-local" name="end" required value="' +
            (cal ? datetime(cal.end) : day + 'T12:00') +
            '" ' +
            (!q.canEdit ? 'disabled' : '') +
            '></label></div><p>見積期限：' +
            dateLabel(q.fields.deadline) +
            '</p><label><input type="checkbox" name="overlap">重なりを承知して保存</label><p class="quote-hint">手動で保存すると固定され、自動配置では動きません。</p>' +
            (cal && q.canEdit
              ? '<p>' +
                fixed(q) +
                '</p>' +
                button(
                  cal.fixed ? 'unlock' : 'lock',
                  cal.fixed ? '固定を解除する' : '固定する',
                  q.id,
                ) +
                (!cal.fixed ? button('replan', 'この予定だけ再配置', q.id) : '')
              : '') +
            (q.calendar?.deleted
              ? '<p class="quote-warning">Googleで削除された予定です。保存すると新しい予定を作成します。</p>'
              : ''),
          q.canEdit && model.calendarReady ? 'schedule' : '',
          q.id,
          q.rev,
        ),
      );
    }
    async function plan(id) {
      const from = range < model.today ? model.today : range;
      draft = await rpc('prepareQuoteSchedule', token, from, addDays(from, 30), id || '');
      await refresh();
      open(
        form(
          '予定案を確認',
          '<p>' +
            esc(from) +
            'から30日間。' +
            (id
              ? '選択した予定だけを再配置します。'
              : '未配置の物件を期限順に午前・午後へ割り振ります。') +
            '日時は登録前に変更できます。</p><div class="quote-draft">' +
            draft.items
              .map(
                (i) =>
                  '<article data-quote-deadline="' +
                  esc(row(i.id).fields.deadline) +
                  '">' +
                  esc(title(row(i.id))) +
                  '<div class="quote-form-grid"><label>開始<input type="datetime-local" required name="start_' +
                  esc(i.id) +
                  '" value="' +
                  datetime(i.start) +
                  '"></label><label>終了<input type="datetime-local" required name="end_' +
                  esc(i.id) +
                  '" value="' +
                  datetime(i.end) +
                  '"></label></div>' +
                  '<p class="quote-hint">見積期限：' +
                  esc(row(i.id).fields.deadline) +
                  '</p><p class="quote-warning" data-quote-late>' +
                  (i.late ? '提出期限を超えています' : '') +
                  '</p>' +
                  '</article>',
              )
              .join('') +
            draft.skipped
              .map(
                (i) =>
                  '<p class="quote-warning">' +
                  esc(title(row(i.id))) +
                  '：' +
                  esc(i.reason) +
                  '</p>',
              )
              .join('') +
            '</div>' +
            (draft.items.length ? '' : '<p>配置できる未配置の受付はありません。</p>'),
          draft.items.length ? 'apply' : '',
        ),
      );
    }
    document.addEventListener(
      'click',
      async (e) => {
        const b = e.target.closest('[data-q]');
        if (!b) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        if (busy) return;
        const action = b.dataset.q,
          q = row(b.dataset.qId);
        if (action === 'close') {
          dialog.close();
          return;
        }
        if (action === 'new') {
          if (role === '管理者') return;
          edit(null);
          return;
        }
        if (action === 'edit') {
          edit(q);
          return;
        }
        if (action === 'schedule') {
          schedule(q);
          return;
        }
        busy = true;
        b.disabled = true;
        try {
          if (action === 'refresh') await refresh();
          if ((action === 'week' || action === 'month') && action !== calendarMode) {
            calendarMode = action;
            redraw();
            await refresh();
          }
          if (['previous', 'next'].includes(action)) {
            const offset = action === 'previous' ? -1 : 1;
            range = calendarMode === 'month' ? monthStart(range, offset) : addDays(range, offset * 7);
            redraw();
            await refresh();
          }
          if (action === 'plan' || action === 'replan') {
            if (dialog.open) dialog.close();
            await plan(action === 'replan' ? q.id : '');
          }
          if (action === 'unlock' || action === 'lock') {
            await rpc(
              'setQuoteScheduleFixed',
              token,
              q.id,
              q.rev,
              action === 'lock',
              q.calendar.etag,
            );
            dialog.close();
            await refresh();
            schedule(row(q.id));
          }
          if (action === 'conflict')
            open(
              form(
                'Excelとの変更を確認',
                '<p>項目ごとに採用する内容を選んでください。</p>' +
                  Object.entries(q.conflicts)
                    .map(
                      ([k, c]) =>
                        '<fieldset><legend>' +
                        esc(fieldNames[k] || k) +
                        '</legend><label><input required type="radio" name="' +
                        esc(k) +
                        '" value="site">サイト：' +
                        esc(c.site) +
                        '</label><br><label><input type="radio" name="' +
                        esc(k) +
                        '" value="excel">Excel：' +
                        esc(c.excel) +
                        '</label></fieldset>',
                    )
                    .join(''),
                'conflict',
                q.id,
                q.rev,
              ),
            );
          if (action === 'download') {
            const a = await rpc('getQuoteDrawing', token, q.id, b.dataset.attachment),
              bytes = Uint8Array.from(atob(a.base64), (c) => c.charCodeAt(0)),
              url = URL.createObjectURL(new Blob([bytes], { type: 'application/octet-stream' }));
            const link = document.createElement('a');
            link.href = url;
            link.download = a.name;
            link.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          }
        } catch (e) {
          if (dialog.open && dialog.querySelector('.quote-form-error'))
            dialog.querySelector('.quote-form-error').textContent = e.message;
          else {
            error = e.message;
            redraw();
          }
          if (typeof showAppError === 'function') showAppError(e, '見積の操作');
        } finally {
          busy = false;
          b.disabled = false;
        }
      },
      true,
    );
    document.addEventListener('change', (e) => {
      const article = e.target.closest('[data-quote-deadline]');
      if (article) {
        const end = article.querySelector('[name^="end_"]').value;
        article.querySelector('[data-quote-late]').textContent =
          end.slice(0, 10) > article.dataset.quoteDeadline ? '提出期限を超えています' : '';
      }
      if (e.target.id === 'quote-search') {
        search = e.target.value;
        redraw();
      }
      if (e.target.id === 'quote-status') {
        status = e.target.value;
        redraw();
      }
      if (e.target.id === 'quote-ordered') {
        ordered = e.target.checked;
        redraw();
      }
      if (e.target.id === 'quote-range' && e.target.value) {
        range = calendarMode === 'month' ? e.target.value + '-01' : e.target.value;
        redraw();
        refresh();
      }
    });
    document.addEventListener(
      'submit',
      async (e) => {
        if (e.target.id !== 'quote-form') return;
        e.preventDefault();
        e.stopImmediatePropagation();
        if (busy) return;
        const formEl = e.target,
          values = Object.fromEntries(new FormData(formEl)),
          action = formEl.dataset.action,
          id = formEl.dataset.id,
          q = row(id);
        busy = true;
        const submit = formEl.querySelector('[type=submit]');
        if (submit) submit.disabled = true;
        try {
          if (action === 'new' || action === 'edit') {
            const files = [...formEl.querySelector('[name=drawings]').files];
            if (
              files.length + (q?.attachments.length || 0) > 20 ||
              files.some((f) => f.size > 10485760)
            )
              throw Error('図面は20ファイルまで、1ファイル10MB以内で選んでください');
            delete values.drawings;
            if (!values.deadline) delete values.deadline;
            if (!values.plan || (q && Number(values.plan) === q.plan)) delete values.plan;
            let saved =
              action === 'new'
                ? await rpc('createQuoteReception', token, formEl.dataset.requestId, values)
                : await rpc(
                    'updateQuoteReception',
                    token,
                    id,
                    Number(formEl.dataset.revision),
                    values,
                  );
            formEl.dataset.id = saved.id;
            formEl.dataset.revision = saved.rev;
            formEl.dataset.action = 'edit';
            for (const file of files) {
              const key = file.name + ':' + file.size + ':' + file.lastModified;
              formEl.uploads ??= {};
              formEl.uploads[key] ??= crypto.randomUUID();
              const base64 = await new Promise((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => resolve(String(r.result).split(',')[1]);
                r.onerror = () => reject(Error('図面を読み込めませんでした'));
                r.readAsDataURL(file);
              });
              saved = await rpc(
                'addQuoteDrawing',
                token,
                saved.id,
                saved.rev,
                formEl.uploads[key],
                file.name,
                file.type,
                base64,
              );
              formEl.dataset.revision = saved.rev;
            }
          }
          if (action === 'schedule')
            await rpc(
              'saveQuoteSchedule',
              token,
              id,
              Number(formEl.dataset.revision),
              values.start + ':00+09:00',
              values.end + ':00+09:00',
              q.calendar?.etag || '',
              values.overlap === 'on',
            );
          if (action === 'conflict')
            await rpc('resolveQuoteConflict', token, id, Number(formEl.dataset.revision), values);
          if (action === 'apply') {
            await rpc(
              'reviseQuoteScheduleDraft',
              token,
              draft.id,
              draft.items.map((i) => ({
                id: i.id,
                start: values['start_' + i.id] + ':00+09:00',
                end: values['end_' + i.id] + ':00+09:00',
              })),
            );
            const result = await rpc('applyQuoteSchedule', token, draft.id);
            if (!result.complete) throw Error(result.message + ' ' + result.error);
          }
          dialog.close();
          await refresh();
        } catch (e) {
          formEl.querySelector('.quote-form-error').textContent = e.message || String(e);
          if (typeof showAppError === 'function') showAppError(e, '見積の保存');
        } finally {
          busy = false;
          if (submit) submit.disabled = false;
        }
      },
      true,
    );
    setInterval(() => {
      if (
        tab === 'quotes' &&
        !dialog.open &&
        !busy &&
        !loading &&
        document.visibilityState === 'visible'
      )
        refresh();
    }, 60000);
    return { view, refresh };
  })();
</script>

<script>
let salesQuoteDraft = null;
let salesQuoteContext = '';
let salesQuoteEntryOpen = false;
let salesQuoteCustomerConfirmed = '';
// 表記は書き換えず、比較するときだけ全半角・法人種別・空白などを揃える。
function quoteCustomerCompareKey(name) {
  return String(name || '').normalize('NFKC').toLowerCase()
    .replace(/株式会社|有限会社|合同会社|合資会社|合名会社|[（(](?:株|有|同|資|名)[）)]/g, '')
    .replace(/[\s\p{P}\p{S}]/gu, '')
    .replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
}
function similarQuoteCustomers(value) {
  const name = String(value || '').trim(), names = data.quoteCustomerNames || [];
  if (!name || names.includes(name)) return [];
  const key = quoteCustomerCompareKey(name);
  if (!key) return [];
  return names.filter(existing => {
    const other = quoteCustomerCompareKey(existing);
    if (!other) return false;
    if (key === other) return true;
    const min = Math.min(key.length, other.length), max = Math.max(key.length, other.length);
    if (min < 4 || min / max < 0.8) return false;
    if (key.includes(other) || other.includes(key)) return true;
    let row = Array.from({length:other.length+1}, (_, i) => i);
    for (let i=0; i<key.length; i++) {
      const next = [i+1];
      for (let j=0; j<other.length; j++) next.push(Math.min(next[j]+1, row[j+1]+1, row[j]+(key[i]===other[j]?0:1)));
      row = next;
    }
    return row[other.length] <= (max >= 8 ? 2 : 1);
  });
}
function quoteCustomerCheckHtml(value) {
  const names = similarQuoteCustomers(value);
  if (!names.length || salesQuoteCustomerConfirmed === String(value || '').trim()) return '';
  return '<div class="customer-name-check" role="alert" style="border:3px solid #bc7600;background:#fff5d9;padding:14px;border-radius:12px;margin:12px 0"><strong>⚠ 似た受注先が登録されています</strong><p>同じ会社ではありませんか？ 同じ受注先なら、下の既存名を選んでください。</p>' +
    names.map(name => '<button type="button" data-sales-quote-customer-choice="'+escape(name)+'" style="display:block;margin:8px 0;min-height:44px">既存名を使う：'+escape(name)+'</button>').join('') +
    '<p>別の受注先の場合は、入力した名前を確認してから登録できます。</p><button type="button" data-sales-quote-customer-confirm>「'+escape(value)+'」は別の受注先です（入力名を使う）</button></div>';
}
function updateQuoteCustomerCheck(focus = false) {
  const box = document.querySelector('#sales-quote-customer-check');
  if (!box) return;
  box.innerHTML = quoteCustomerCheckHtml(salesQuoteDraft?.customer);
  if (focus && box.innerHTML) { box.scrollIntoView({block:'center'}); box.querySelector('button')?.focus(); }
}
function canCreateQuoteEntry() {
  return !data.adminPreview && role === '営業' && canSales();
}
function salesQuoteDeadline(days) {
  const date = new Date(data.today + 'T00:00:00Z');
  date.setUTCDate(date.getUTCDate() + days);
  return date.toISOString().slice(0, 10);
}
function salesQuoteEntryPanel() {
  const context = JSON.stringify([token, data.user.alias, role]);
  if (salesQuoteContext !== context) { salesQuoteDraft = null; salesQuoteEntryOpen = false; salesQuoteCustomerConfirmed = ''; salesQuoteContext = context; }
  if (!canCreateQuoteEntry()) return '';
  const d = salesQuoteDraft;
  const customers = data.quoteCustomerNames || [];
  const input = (name, label, type = 'text', attrs = '') => '<label>' + label +
    '<input name="' + name + '" type="' + type + '" value="' + escape(d?.[name] ?? '') + '" ' + attrs + '></label>';
  return '<section class="panel sales-quote-entry" aria-label="新しい見積の登録"><h2>新しい見積</h2>' +
    (!salesQuoteEntryOpen ? (d ? '<p class="entry-draft-note">入力途中の見積があります。'+escape(d.customer || '')+' '+escape(d.site || '')+'</p>' : '<p class="small">受注先・現場・期限が分かれば受付できます。</p>') + '<button type="button" data-sales-quote-new class="primary">'+(d ? '入力途中の見積を続ける' : '＋ 新しい見積を登録')+'</button>' :
    '<form id="sales-quote-entry-form"><p class="entry-intro">担当営業：<strong>' + escape(data.user.name) + '</strong> ／ 受付日：' + escape(d.receivedDate) + '<br><span class="small">必須は受注先・現場名・見積期限です。分からない項目は空欄で受付できます。</span></p><div class="grid entry-main">' +
    '<div>' + input('customer', '受注先名（必須）', 'text', 'required maxlength="150" list="sales-quote-customers" autocomplete="organization" placeholder="名前を入力、または候補から選択"') +
    '<datalist id="sales-quote-customers">'+customers.map(name=>'<option value="'+escape(name)+'"></option>').join('')+'</datalist>' +
    '<p class="small">全担当の既存受注先から選べます。新しい受注先は直接入力できます。</p></div>' +
    input('site', '現場名（必須）', 'text', 'required maxlength="150" placeholder="例：山田様邸"') +
    '<div>' + input('deadline', '見積期限（必須）', 'date', 'required min="'+escape(d.receivedDate)+'"') + '<div class="deadline-shortcuts" aria-label="本日からの見積期限の候補"><button type="button" data-sales-quote-days="1">明日</button><button type="button" data-sales-quote-days="3">3日後</button><button type="button" data-sales-quote-days="7">1週間後</button></div><p class="small">選んだ日付は変更できます。</p></div>' +
    '<label>CAD担当（未定でも受付可）<select name="cad"><option value="">未定</option>' + (data.quoteCadPeople || []).map(p =>
      '<option value="' + escape(p.alias) + '" ' + (d.cad === p.alias ? 'selected' : '') + '>' + escape(p.name) + '</option>').join('') + '</select></label>' +
    '</div><div id="sales-quote-customer-check">'+quoteCustomerCheckHtml(d.customer)+'</div><p class="small">CADが決まると担当者へ見積依頼のお知らせが届きます。</p><details class="entry-options"><summary>分かる範囲で追加入力（坪数・仕様・金額など）</summary><div class="grid">' +
    input('floor', '階数', 'text', 'maxlength="30" list="sales-quote-floors"') + '<datalist id="sales-quote-floors"><option value="平屋"></option><option value="2階建て"></option><option value="3階建て"></option></datalist>' + input('spec', '仕様', 'text', 'maxlength="200"') +
    input('area', '坪数', 'number', 'min="0" max="1000000" step="any"') +
    input('shipping', '第一出荷予定日', 'date') + input('erection', '上棟予定日', 'date') +
    input('amount', '見積金額（円・未定なら空欄）', 'number', 'min="0" max="1000000000000" step="1"') +
    '</div><label>CADへの連絡・補足<textarea name="note" maxlength="1000" placeholder="図面の変更点や、先に伝えておきたいこと">' + escape(d.note || '') + '</textarea></label>' +
    '<p class="small">金額は見積金額欄に入力し、原価・採算は補足に記入しないでください。</p>' +
    '<p class="small">見積金額は担当営業と管理者が確認でき、CAD画面には表示されません。</p></details><details class="entry-options"><summary>受付日・受付番号を変更する</summary><div class="grid">' + input('receivedDate', '受付日', 'date', 'required max="' + data.today + '"') + input('receiptNumber', '受付№（未定なら空欄）', 'text', 'maxlength="40"') + '</div></details><div class="entry-actions"><button class="primary">見積を登録する</button><button type="button" data-sales-quote-cancel>あとで続ける</button></div><p class="small">「あとで続ける」で閉じても、この画面を開いている間は入力内容を保持します。ページを再読み込みすると消えるため、入力中はそのままお使いください。</p></form>') + '</section>';
}
document.addEventListener('click', e => {
  const customerChoice = e.target.closest('[data-sales-quote-customer-choice]');
  if (customerChoice && canCreateQuoteEntry() && salesQuoteDraft) {
    salesQuoteDraft.customer = customerChoice.dataset.salesQuoteCustomerChoice;
    salesQuoteCustomerConfirmed = '';
    const field = document.querySelector('#sales-quote-entry-form [name="customer"]');
    if (field) { field.value = salesQuoteDraft.customer; field.focus(); }
    updateQuoteCustomerCheck();
  }
  if (e.target.closest('[data-sales-quote-customer-confirm]') && canCreateQuoteEntry() && salesQuoteDraft) {
    salesQuoteCustomerConfirmed = String(salesQuoteDraft.customer || '').trim();
    updateQuoteCustomerCheck();
    document.querySelector('#sales-quote-entry-form button.primary')?.focus();
  }
  if (e.target.closest('[data-sales-quote-new]') && canCreateQuoteEntry()) {
    if (!salesQuoteDraft) { salesQuoteDraft = { requestId: crypto.randomUUID(), receivedDate: data.today }; salesQuoteCustomerConfirmed = ''; }
    salesQuoteEntryOpen = true;
    render();
  }
  if (e.target.closest('[data-sales-quote-cancel]')) { salesQuoteEntryOpen = false; render(); }
  const shortcut = e.target.closest('[data-sales-quote-days]');
  if (shortcut && canCreateQuoteEntry() && salesQuoteDraft) {
    const days = Number(shortcut.dataset.salesQuoteDays);
    if (![1,3,7].includes(days)) return;
    salesQuoteDraft.deadline = salesQuoteDeadline(days);
    const field = document.querySelector('#sales-quote-entry-form [name="deadline"]');
    if (field) field.value = salesQuoteDraft.deadline;
  }
});
document.addEventListener('input', e => {
  if (e.target.closest('#sales-quote-entry-form') && salesQuoteDraft) {
    salesQuoteDraft[e.target.name] = e.target.value;
    if (e.target.name === 'customer') { salesQuoteCustomerConfirmed = ''; updateQuoteCustomerCheck(); }
  }
});
document.addEventListener('change', e => {
  if (e.target.closest('#sales-quote-entry-form') && salesQuoteDraft) {
    salesQuoteDraft[e.target.name] = e.target.value;
    if (e.target.name === 'customer') { salesQuoteCustomerConfirmed = ''; updateQuoteCustomerCheck(); }
  }
});
document.addEventListener('submit', e => {
  if (e.target.id !== 'sales-quote-entry-form') return;
  e.preventDefault(); e.stopImmediatePropagation();
  if (!canCreateQuoteEntry() || !salesQuoteDraft) return;
  const input = Object.fromEntries(new FormData(e.target).entries());
  Object.assign(salesQuoteDraft, input);
  if (similarQuoteCustomers(input.customer).length && salesQuoteCustomerConfirmed !== String(input.customer || '').trim()) {
    updateQuoteCustomerCheck(true);
    return;
  }
  const requestId = salesQuoteDraft.requestId;
  task(async () => {
    const result = await rpc('createSalesQuote', token, requestId, input, role);
    if (!result?.saved) throw Error('保存を確認できません。同じ画面からもう一度登録してください。');
    salesQuoteDraft = null; salesQuoteEntryOpen = false; selected = result.id; tab = 'cases';
    render();
    try { await load(); }
    catch (error) { throw Error('見積は保存済みです。一覧の更新に失敗しました。「案件データを更新」で確認してください。' + error.message); }
    message('✓ ' + result.message);
  }, '見積を登録しています');
}, true);
</script>

<script>
const customerAliasReviews = new Map();
function customerAliasPanel(p) {
  if (data.adminPreview || role !== '管理者') return '';
  const saved = customerAliasReviews.get(p.id), review = saved?.token === token && saved.review.newName === p.customer ? saved.review : null;
  return '<details data-customer-alias-panel="'+escape(p.id)+'" class="entry-options" '+(review?'open':'')+'><summary>受注先の旧名を登録（管理者）</summary><p>社名変更・表記統一の後、以前の名前を登録すると共有メモを引き継げます。会社や支店が異なる場合は登録しないでください。シートの受注先名は変更しません。</p>' +
    '<form data-customer-alias-review="'+escape(p.id)+'"><label>現在の受注先名<input readonly value="'+escape(p.customer)+'"></label><label>変更前の受注先名<input name="oldName" maxlength="150" required value="'+escape(review?.oldName||'')+'" placeholder="変更前の名前を正確に入力"></label><button>登録内容を確認</button></form>' +
    (review ? '<div data-customer-alias-review-result class="warn" style="padding:12px;margin-top:12px"><strong>旧名：'+escape(review.oldName)+'<br>現在名：'+escape(review.newName)+'</strong><p>共有メモの記録：旧名側 '+review.oldMemoCount+'件 ／ 現在名側 '+review.newMemoCount+'件</p>' +
      (review.alreadyLinked?'<p>既に同じ受注先として扱われています。</p>':'<form data-customer-alias-save="'+escape(p.id)+'"><label class="daily-recipient"><input type="checkbox" name="sameCompany" required> 会社・支店・取引窓口が同じ受注先であることを確認しました</label><button class="primary">旧名と現在名を対応付ける</button></form>')+'</div>' : '')+'</details>';
}
document.addEventListener('input', e => {
  const form = e.target.closest('form[data-customer-alias-review]');
  if (!form || e.target.name !== 'oldName') return;
  customerAliasReviews.delete(form.getAttribute('data-customer-alias-review'));
  form.closest('[data-customer-alias-panel]')?.querySelector('[data-customer-alias-review-result]')?.remove();
});
document.addEventListener('submit', e => {
  const form = e.target;
  if (!form.hasAttribute('data-customer-alias-review') && !form.hasAttribute('data-customer-alias-save')) return;
  e.preventDefault(); e.stopImmediatePropagation();
  if (data.adminPreview || role !== '管理者') return;
  const caseId = form.getAttribute('data-customer-alias-review') || form.getAttribute('data-customer-alias-save');
  task(async () => {
    if (form.hasAttribute('data-customer-alias-review')) {
      const review = await rpc('previewCustomerAlias', token, caseId, form.elements.oldName.value, role);
      customerAliasReviews.set(caseId, { token, review });
      const p = data.projects.find(p => p.id === caseId), panel = form.closest('[data-customer-alias-panel]');
      if (p && panel) panel.outerHTML = customerAliasPanel(p);
      message('旧名と現在名、共有メモの件数を確認してください。まだ保存していません。');
      return;
    }
    const saved = customerAliasReviews.get(caseId);
    if (!saved || saved.token !== token || !form.elements.sameCompany.checked) throw Error('先に登録内容と同じ受注先であることを確認してください');
    const p = data.projects.find(p => p.id === caseId), section = form.closest('section.panel'), memoForm = section?.querySelector('form[data-customer-guidance]');
    const dirty = memoForm && (memoForm.elements.note.value !== (p.customerGuidance.note || '') || memoForm.elements.designatedMaterial.checked !== p.customerGuidance.designatedMaterial);
    const draft = dirty ? { note: memoForm.elements.note.value, designatedMaterial: memoForm.elements.designatedMaterial.checked } : null;
    const result = await rpc('saveCustomerAlias', token, caseId, { oldName: saved.review.oldName, reviewToken: saved.review.reviewToken, sameCompany: true }, role);
    customerAliasReviews.delete(caseId);
    if (p && section && result.guidance) {
      p.customerGuidance = result.guidance;
      const replacement = document.createElement('div');
      replacement.innerHTML = customerGuidancePanel(p);
      const next = replacement.firstElementChild;
      if (draft) { const form = next.querySelector('form[data-customer-guidance]'); if (form) { form.elements.note.value = draft.note; form.elements.designatedMaterial.checked = draft.designatedMaterial; } }
      section.replaceWith(next);
    }
    message('✓ '+result.message);
  }, '受注先の旧名を確認しています');
}, true);
</script>

<script>
let pwaConfirmationQueue=Promise.resolve(),pwaConfirmationUi=null;
let pwaConfirmationScope='',pwaConfirmedReports=new Map(),pwaConfirmationPending=new Set();
function pwaClearConfirmationSession(){
  pwaConfirmationScope='';pwaConfirmedReports=new Map();pwaConfirmationPending=new Set();
  pwaConfirmationQueue=Promise.resolve();
  pwaConfirmationUi=null;
  const region=$('pwa-confirm-feedback');
  if(region)region.hidden=true;
}
function pwaConfirmationSession(){
  const scope=pwaDisplayScope();
  if(scope!==pwaConfirmationScope){pwaClearConfirmationSession();pwaConfirmationScope=scope;}
  return {scope,pending:pwaConfirmationPending,reports:pwaConfirmedReports};
}
function pwaQueueConfirmation(work){
  const next=pwaConfirmationQueue.then(work);
  pwaConfirmationQueue=next.catch(()=>{});
  return next;
}
function pwaConfirmationFeedback(button){
  const region=$('pwa-confirm-feedback'),expected=token,notice={};
  pwaConfirmationUi=notice;
  button.classList.add('pwa-confirm-pressed');
  const update=(text,mode)=>{
    if(token!==expected||pwaConfirmationUi!==notice)return;
    region.hidden=false;
    region.dataset.phase=mode;
    region.replaceChildren();
    const mark=document.createElement('span');
    mark.className='pwa-confirm-mark';
    mark.setAttribute('aria-hidden','true');
    mark.textContent=mode==='failed'?'!':'✓';
    region.append(mark,document.createTextNode(text));
    if(mode==='saved')setTimeout(()=>{if(pwaConfirmationUi===notice)region.hidden=true;},2000);
  };
  update('受け付けました · 反映中','pending');
  return {
    saved:()=>update('確認済み','saved'),
    failed:()=>update('反映を確認できませんでした。再試行してください','failed'),
  };
}
function pwaApplyConfirmedReports(snapshot){
  for(const row of snapshot.reports||[]){
    const ack=pwaConfirmationSession().reports.get(String(row[0]));
    if(ack){row[7]='営業確認済み';row[8]=ack;}
  }
}
function pwaRunAcknowledgement(button,key,send,apply){
  if(!token||busy||data?.adminPreview||previewSelection)return;
  const state=pwaConfirmationSession();
  if(state.pending.has(key))return;
  state.pending.add(key);
  const cue=pwaConfirmationFeedback(button),label=button.textContent;
  button.textContent='反映中…';button.disabled=true;button.setAttribute('aria-busy','true');
  pwaQueueConfirmation(async()=>{
    try{
      if(pwaDisplayScope()!==state.scope)return;
      const result=await send();
      if(pwaDisplayScope()!==state.scope)return;
      apply(result,state);
      cue.saved();
    }catch(error){
      if(pwaDisplayScope()===state.scope){cue.failed();message(error.message);}
    }finally{
      state.pending.delete(key);
      if(pwaDisplayScope()===state.scope&&button.isConnected){
        button.removeAttribute('aria-busy');button.disabled=false;button.textContent=label;
      }
    }
  });
}
function pwaConfirmDrawingReport(button){
  const id=button.dataset.ack,expected=token;
  pwaRunAcknowledgement(button,'drawing:'+id,()=>rpc('acknowledgeReport',expected,id),(result,state)=>{
    if(result!==true)throw Error('確認の保存結果を確認できませんでした');
    state.reports.set(id,data.user.name);
    pwaApplyConfirmedReports(data);
    // 確認ボタンはその場で完了表示にし、ほかの入力欄を描画し直さない。
    document.querySelectorAll('[data-ack]').forEach(node=>{
      if(node.dataset.ack===id){const status=document.createElement('span');status.className='progress-done';status.textContent='✓ 確認済み';node.replaceWith(status);}
    });
  });
}
function pwaConfirmCaseChanges(button){
  const id=button.dataset.caseActivityRead,expected=token,
    project=data?.projects.find(p=>p.id===id),tokens=project?.activity?.unreadTokens||[];
  if(!tokens.length)return;
  const dialog=button.closest('dialog');
  pwaRunAcknowledgement(button,'history:'+id,()=>rpc('markCaseActivityRead',expected,id,tokens),result=>{
    if(!result||!Array.isArray(result.unreadTokens))throw Error('確認の保存結果を確認できませんでした');
    const current=data.projects.find(p=>p.id===id);
    if(current)current.activity=result;
    project.activity=result;
    if(dialog?.open&&dialog.contains(button))dialog.close();
    if(button.isConnected&&button.closest('#content'))render();
  });
}
</script>

<script>
let pwaLoadedView=null,pwaPendingView=null,pwaDashboardRead=0,pwaDetailAnchor=null;
let pwaLists=null,pwaListOpenPending=false,pwaListAutoAt=0,pwaListAutoRead=null,pwaListRefresh=null;
const pwaViewLabels={
  home:'ホーム',overview:'業務サマリー',cases:'案件一覧',detail:'案件詳細',quotes:'見積用',
  questions:'確認依頼',schedule:'営業予定','cad-team':'CADチーム','cad-monthly':'CAD月間実績',
  performance:'月間売上',daily:'日報',notifications:'お知らせ',cancellations:'受注キャンセル',
  prevention:'ミス・再発防止',troubles:'困りごと',prospects:'新規開拓'
};
function pwaDisplayScope(displayRole=role){
  return JSON.stringify([token,previewSelection,displayRole]);
}
function pwaTargetView(){
  if(window.aiboOperations.productionRead)return {name:'legacy',caseId:''};
  if(selected&&(['home','overview','cases','questions','notifications','cad-team'].includes(tab)||tab==='quotes'&&role==='管理者'))
    return {name:'detail',caseId:selected};
  return {name:tab,caseId:tab==='cases'?(role==='管理者'?progressFilter:filter):''};
}
function pwaViewKey(view=pwaTargetView(),displayRole=role){
  return JSON.stringify([pwaDisplayScope(displayRole),view.name,view.caseId]);
}
async function pwaReadDashboard(view, expectedToken){
  if(['legacy','overview'].includes(view.name))
    return {snapshot:await rpc('getDashboard',expectedToken,previewSelection?.alias||'',previewSelection?.role||'')};
  if(view.name==='home'&&pwaListOpenPending){
    pwaListOpenPending=false;
    const lists=await rpc('getPwaPreparedLists',expectedToken,previewSelection?.alias||'',previewSelection?.role||'').catch(error=>{if(error.code==='INVALID'||error.code==='BUSINESS_ERROR')return null;throw error;});
    if(lists?.home&&lists?.cases)return {snapshot:lists.home,lists};
  }
  const [snapshot,daily]=await Promise.all([
    rpc('getDashboardView',expectedToken,view.name,view.name==='cases'?'受注':view.caseId,previewSelection?.alias||'',previewSelection?.role||''),
    view.name==='daily'&&!dailyState?rpc('getDailyReport',expectedToken,data.today):null
  ]);
  return {snapshot,daily};
}
function pwaAcceptDashboard(snapshot,view,daily,started,lists){
  const scope=pwaDisplayScope(snapshot.activeRole);
  const previous=pwaLoadedView?.scope===scope?data:null;
  if(lists){
    pwaListAutoAt=Date.now();
    pwaStorePreparedLists(lists,scope);
  }else if(['home','cases'].includes(view.name)){
    pwaListAutoAt ||= Date.now();
    if(pwaLists?.scope!==scope)pwaLists={scope};
    pwaLists[view.name]={value:snapshot,at:Date.now()};
  }
  pwaApplyConfirmedReports(snapshot);
  if(view.name!=='legacy'){
    snapshot.projects??=[];
    snapshot.notifications??=previous?.notifications||{unread:0,items:[]};
    snapshot.schedulePriority??=previous?.schedulePriority;
    snapshot.projectRowsUnavailable??=previous?.projectRowsUnavailable??false;
    if(daily)dailyState=daily;
  }
  pwaLoadedView={key:pwaViewKey(view,snapshot.activeRole),scope,name:view.name};
  $('content').dataset.pwaView=view.name;
  $('content').dataset.pwaViewMs=String(Math.round(performance.now()-started));
}
function pwaViewStatus(view,error){
  const content=$('content');
  content.innerHTML='<section class="panel" role="status"><h2>'+escape(pwaViewLabels[view.name]||'業務画面')+'</h2>'
    +(error?'<p>データを取得できませんでした。</p><button type="button" id="pwa-retry-view">もう一度読み込む</button>':
      '<p>読み込んでいます…</p><div class="pwa-startup-rows" aria-hidden="true"><span></span><span></span><span></span></div>')+'</section>';
  if(view.name==='cases'&&pwaLoadedView?.scope===pwaDisplayScope()&&pwaLoadedView.name==='cases'){
    const buckets=content.querySelector('section');
    const ps=visible();
    const filters=role==='管理者'?progressTabs(ps):'<div class="filters">'+['見積','受注','上棟済','失注'].map(bucket=>
      '<button type="button" data-filter="'+bucket+'" aria-pressed="'+(bucket===filter)+'">'+bucket+'物件 '+ps.filter(p=>matchesBucket(p,bucket)).length+'件</button>'
    ).join('')+'</div>';
    buckets.insertAdjacentHTML('beforeend',filters);
  }
  content.dataset.pwaView=error?'error':'loading';
  delete content.dataset.pwaViewMs;
  content.setAttribute('aria-busy',String(!error));
  if(error){
    if(pwaLoadedView?.key===pwaViewKey(view))pwaLoadedView=null;
    $('pwa-retry-view').onclick=render;
    message(error.message);
  }
  updateMainNavigation();
  window.aiboWorkspace.update(tab,selected,false);
}
function pwaEnsureDashboardView(){
  if(window.aiboOperations.productionRead||!data||!token)return true;
  const view=pwaTargetView(),key=pwaViewKey(view);
  if(pwaLoadedView?.key===key){
    $('content').removeAttribute('aria-busy');
    return true;
  }
  if(pwaRestoreListView(view))return true;
  if(pwaPendingView?.key===key)return false;
  pwaViewStatus(view);
  const pending={key};
  pwaPendingView=pending;
  load().catch(error=>{
    if(token&&pwaPendingView===pending&&pwaViewKey()===key)pwaViewStatus(view,error);
  }).finally(()=>{
    if(pwaPendingView===pending)pwaPendingView=null;
  });
  return false;
}
function pwaStorePreparedLists(lists,scope){
  if(pwaLists?.scope!==scope)pwaLists={scope};
  for(const view of ['home','cases']){
    if((pwaLists[view]?.at||0)<lists.syncedAt)
      pwaLists[view]={value:lists[view],at:lists.syncedAt};
  }
}
function pwaRestoreListView(view){
  const scope=pwaDisplayScope();
  const record=['home','cases'].includes(view.name)&&pwaLists?.scope===scope?pwaLists[view.name]:null;
  if(!record)return false;
  const next=record.value,previous=pwaLoadedView?.scope===scope?data:null;
  next.notifications=previous?.notifications||next.notifications||{unread:0,items:[]};
  next.schedulePriority=previous?.schedulePriority||mergeSchedulePrioritySnapshot(next.schedulePriority,nextSchedulePriorityRead(),!!next.adminPreview);
  pwaApplyConfirmedReports(next);
  data=next;
  pwaLoadedView={key:pwaViewKey(view),scope,name:view.name};
  $('project-data-warning').hidden=!next.projectRowsUnavailable;
  $('content').dataset.pwaView=view.name;
  $('content').dataset.pwaViewMs='0';
  $('content').removeAttribute('aria-busy');
  return true;
}
function pwaUpdateListSync(){
  const panel=$('pwa-list-sync');
  if(!panel)return;
  const view=pwaTargetView(),scope=pwaDisplayScope();
  const record=pwaLists?.scope===scope&&pwaLists[view.name];
  panel.hidden=!record;
  if(!record)return;
  const time=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(record.at);
  const pending=pwaListRefresh?.scope===scope;
  $('pwa-list-sync-time').textContent=(pending?'最新の情報を取得中 · ':'')+'最終同期 '+time;
  $('pwa-list-refresh').disabled=pending||busy;
}
async function pwaRefreshCurrentList(){
  const scope=pwaDisplayScope();
  const view=pwaTargetView();
  if(!token||busy||pwaListRefresh?.scope===scope||!['home','cases'].includes(view.name))return;
  const request={scope,key:pwaViewKey(view)};
  pwaListRefresh=request;
  pwaUpdateListSync();
  try{
    await load();
    if(pwaDisplayScope()===scope&&pwaViewKey()===request.key)message('最新の本番シートを読み込みました。');
  }catch(error){
    if(pwaDisplayScope()===scope)message('更新できませんでした。表示中の情報を残しています。もう一度「最新に更新」を押してください。');
  }finally{
    if(pwaListRefresh===request){pwaListRefresh=null;pwaUpdateListSync();}
  }
}
function pwaReadPreparedQuietly(){
  if(!token||!data||document.hidden||busy||pwaListRefresh||pwaListAutoRead||
      window.aiboOperations.productionRead||Date.now()-pwaListAutoAt<300000)return;
  const hour=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'numeric',hourCycle:'h23'}).format());
  if(hour<6||hour>=21)return;
  const scope=pwaDisplayScope(),expectedToken=token;
  pwaListAutoAt=Date.now();
  const pending=rpc('getPwaPreparedLists',expectedToken,previewSelection?.alias||'',previewSelection?.role||'');
  pwaListAutoRead=pending;
  pending.then(lists=>{
    if(!lists?.home||!lists?.cases||pwaDisplayScope()!==scope||lists.role!==role)return;
    const view=pwaTargetView(),previous=pwaLists?.[view.name];
    pwaStorePreparedLists(lists,scope);
    if(previous===pwaLists[view.name]||!['home','cases'].includes(view.name)||busy||pwaListRefresh||
        document.querySelector('#content details[open], #content form:focus-within, dialog[open]'))return;
    if(pwaRestoreListView(view))render();
  }).catch(()=>{}).finally(()=>{if(pwaListAutoRead===pending)pwaListAutoRead=null;});
}
function pwaClearPreparedLists(){
  pwaLists=null;pwaListOpenPending=false;pwaListAutoRead=null;pwaListAutoAt=0;pwaListRefresh=null;
  pwaClearConfirmationSession();
}
setInterval(pwaReadPreparedQuietly,60000);
document.addEventListener('visibilitychange',pwaReadPreparedQuietly);
window.addEventListener('pagehide',pwaClearPreparedLists);
function pwaAdjustNavigation(){
  const hasSales=['営業','管理者'].includes(role);
  $('schedule-nav').hidden=role!=='営業';
  $('cad-monthly-nav').hidden=!['管理者','CAD'].includes(role);
  $('performance-nav').hidden=!hasSales;
  $('cad-team-nav').hidden=!(role==='CAD'&&data.user.cadLeader);
  $('daily-nav').hidden=!hasSales;
  $('prospect-nav').hidden=!hasSales;
  const past=$('past-toggle').closest('.past-control');
  past.hidden=!!selected||!['overview','cases','questions','cad-team'].includes(tab);
}
function pwaRenderPrimaryView(){
  if(window.aiboOperations.productionRead)return false;
  pwaAdjustNavigation();
  const view=pwaTargetView();
  if(view.name==='home'){
    $('content').innerHTML=todayWorkHome(visible())
      +'<div class="pwa-home-links"><button type="button" data-tab="cases">案件一覧を開く</button>'
      +'<button type="button" data-tab="overview">業務サマリーを開く</button></div>';
    return true;
  }
  if(view.name!=='detail')return false;
  const chosen=data.projects.find(p=>p.id===selected);
  $('content').innerHTML=chosen?detail(chosen):'<section class="panel"><h2>案件を表示できません</h2><button type="button" data-back>前の画面に戻る</button></section>';
  if(pwaDetailAnchor?.key===pwaViewKey())$(pwaDetailAnchor.id)?.scrollIntoView({behavior:'smooth',block:'start'});
  pwaDetailAnchor=null;
  return true;
}
function pwaScrollToDetail(id){
  if($(id))$(id).scrollIntoView({behavior:'smooth',block:'start'});
  else pwaDetailAnchor={key:pwaViewKey(),id};
}
function pwaOpenCaseHistory(project,dialog){
  if(window.aiboOperations.productionRead||!project.activity||project.activity.unreadTokens)return false;
  const expectedToken=token,expectedView=pwaViewKey();
  const heading='<button type="button" data-case-history-close>閉じる</button><h2>'+escape(project.customer+' / '+project.site)+'</h2>';
  dialog.innerHTML=heading+'<p role="status">履歴を読み込んでいます…</p>';
  dialog.showModal();
  const current=()=>dialog.open&&token===expectedToken&&pwaViewKey()===expectedView&&data?.projects.includes(project);
  rpc('getDashboardView',expectedToken,'activity',project.id,previewSelection?.alias||'',previewSelection?.role||'')
    .then(snapshot=>{
      if(!current())return;
      const activity=snapshot.projects.find(p=>p.id===project.id)?.activity;
      if(!activity)throw Error('履歴を表示できませんでした。');
      project.activity=activity;
      dialog.innerHTML=heading+caseActivityPanel(project);
      applyPreviewReadOnly();
      window.aiboOperations.restrictEditing();
    })
    .catch(()=>{
      if(current()){
        dialog.innerHTML=heading+'<p role="alert">履歴を取得できませんでした。</p><button type="button" id="pwa-retry-case-history">再取得</button>';
        $('pwa-retry-case-history').onclick=()=>{dialog.close();pwaOpenCaseHistory(project,dialog);};
      }
    });
  return true;
}
function pwaOpenDaily(){
  tab='daily';selected='';dailyState=null;dailyPreview='';dailyViewing=false;dailyEditIndex=-1;dailyOwnerFilter='';
  render();
}
</script>

<script>
window.aiboOperations.showMode();
const pwaStartup=$('pwa-startup');
function pwaStartupState(text,retry=false){
  $('login').hidden=true;
  pwaStartup.hidden=false;
  $('pwa-startup-status').textContent=text;
  $('pwa-retry-dashboard').hidden=!retry;
}
let pwaAuthStarted=0;
async function openPwaDashboard(){
  const started=performance.now(),expectedToken=token;
  pwaStartupState('業務データを読み込んでいます…');
  if(typeof pwaListOpenPending!=='undefined')pwaListOpenPending=!window.aiboOperations.productionRead;

    await load();
    if(token===expectedToken){
      pwaStartup.dataset.dashboardMs=String(Math.round(performance.now()-started));
      pwaStartup.hidden=true;
    }
  } catch(error){
    if(token===expectedToken){
      pwaStartupState('業務データを取得できませんでした。',true);
      message(error.message);
    }
  }
}
function showPwaLogin(){
  pwaAuthStarted=0;
  pwaStartup.hidden=true;
  $('login').hidden=false;
  window.aiboOperations.setupLogin(value=>{
    token=value;
    if(pwaAuthStarted)pwaStartup.dataset.authMs=String(Math.round(performance.now()-pwaAuthStarted));
    return openPwaDashboard();
  },text=>{
    if(!token){pwaStartup.hidden=true;$('login').hidden=false;}
    message(text);
  },()=>{
    pwaAuthStarted=performance.now();
    pwaStartupState('ログインを確認しています…');

}
$('pwa-retry-dashboard').onclick=openPwaDashboard;
if($('pwa-list-refresh'))$('pwa-list-refresh').onclick=pwaRefreshCurrentList;
window.addEventListener('aibo-session-expired',()=>{
  pwaClearPreparedLists();

  previewSelection=null;showPast=false;role='';tab='home';selected='';$('content').replaceChildren();
  $('app').hidden=true;$('login').hidden=false;showPwaLogin();
});
if($('pwa-login-retry'))$('pwa-login-retry').onclick=showPwaLogin;
if(window.aiboOperations.productionRead){
  window.addEventListener('pagehide',()=>{data=null;$('content').replaceChildren();});
}
if(token)openPwaDashboard();else showPwaLogin();
</script>
