<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#286d59">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>担当案件｜営業の相棒</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="../assets/favicon-32.png">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../mockup/mockup.css">
  <link rel="stylesheet" href="./cases.css">
  <script type="module" src="./cases.mjs"></script>
</head>
<body>
  <main>
    <h1 class="page-title">営業の相棒</h1>
    <p id="status" role="status" aria-live="polite">接続を確認しています。</p>
    <section id="login" class="panel" aria-label="Googleログイン" hidden>
      <div id="google-login"></div>
      <button type="button" id="retry-login" hidden>ログインをやり直す</button>
    </section>
    <section id="dashboard" hidden>
      <h2>CAD担当案件</h2>
      <form id="filters" class="panel">
        <label>案件区分 <select id="bucket">
          <option>見積</option><option>受注</option><option>上棟済</option><option>失注</option>
        </select></label>
        <label><input id="past" type="checkbox"> 過去物件を含める</label>
        <button type="submit" id="refresh">最新情報を取得</button>
        <button type="button" id="logout">ログアウト</button>
      </form>
      <p id="counts"></p>
      <div class="section-list" id="cards"></div>
    </section>
  </main>
</body>
</html>
