<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf9ff">
  <meta name="apple-mobile-web-app-title" content="営業の相棒">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="description" content="営業の相棒の試験画面です。">
  <title>営業の相棒</title>
  <link rel="icon" href="./assets/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./trial.css">
  <script src="./trial-config.js" defer></script>
  <script id="google-identity" src="https://accounts.google.com/gsi/client" async></script>
  <script src="./trial.js" defer></script>
</head>
<body>
  <main class="entrance">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span> 営業の相棒</div>
    <section class="welcome" aria-labelledby="heading">
      <div class="mascot-stage" aria-hidden="true">
        <div class="halo"></div><span class="spark spark-one">✦</span><span class="spark spark-two">✦</span>
        <img class="mascot" src="./assets/icon-512.png" width="512" height="512" alt="" fetchpriority="high">
        <div class="mascot-shadow"></div>
        <div class="speech">今日も、一緒に。</div>
      </div>
      <p class="eyebrow">あなたの仕事に、小さな相棒。</p>
      <h1 id="heading">営業の相棒</h1>
      <div class="trial-card">
        <p class="trial-label">アプリの試験画面</p>
        <p>架空のデータを読み書きします。</p>
        <p class="caption">この画面では本番のデータを扱いません。</p>
        <p><a href="./mockup/">新しい画面のプレビューを見る</a></p>
      </div>
      <section class="test-panel" aria-labelledby="test-title">
        <h2 id="test-title">通信の試験</h2>
        <p class="test-hint">許可されたGoogleアカウントでログインします。入力は架空のデータに限り、実在の名前や案件、個人情報は入力しないでください。</p>
        <div id="signin-area"><div id="google-signin"></div><p class="test-hint">Googleログインは初回と有効期限が切れた場合に必要です。</p></div>
        <div class="test-actions"><button id="read" type="button" disabled>読み込む</button><button id="logout" type="button" disabled>ログアウト</button></div>
        <p id="status" role="status" aria-live="polite">Googleログインを準備しています。</p>
        <ul id="items" aria-label="架空データの一覧"></ul>
        <form id="write-form"><label for="item-name">架空データを追加</label><input id="item-name" maxlength="80" required disabled placeholder="例：テスト用の予定"><button id="write" type="submit" disabled>追加する</button></form>
        <button id="retry" type="button" hidden>保存結果を確認・再試行</button>
      </section>
    </section>
    <footer>営業・CADの毎日を、もっとスムーズに。</footer>
  </main>
</body>
</html>
