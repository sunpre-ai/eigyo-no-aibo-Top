<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf9ff">
  <meta name="apple-mobile-web-app-title" content="営業の相棒">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="営業の相棒の試験画面です。">
  <title>営業の相棒</title>
  <link rel="icon" href="./assets/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./trial.css">
  <script src="./trial.js" defer></script>
</head>
<body>
  <main class="entrance">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✓</span> 営業の相棒</div>
    <section class="welcome" aria-labelledby="heading">
      <div class="mascot-stage" aria-hidden="true">
        <div class="halo"></div><span class="spark spark-one">✦</span><span class="spark spark-two">✦</span>
        <img class="mascot" src="./assets/icon-512.png" width="512" height="512" alt="" fetchpriority="high">
        <div class="mascot-shadow"></div>
        <div class="speech">今日も、一緒に。</div>
      </div>
      <p class="eyebrow">あなたの仕事に、小さな相棒。</p>
      <h1 id="heading">営業の相棒</h1>
      <div class="trial-card">
        <p class="trial-label">アプリの試験画面</p>
        <p>この画面が開けば、準備は完了です。</p>
        <p class="caption">ログインと業務データは、まだつながっていません。</p>
      </div>
    </section>
    <footer>営業・CADの毎日を、もっとスムーズに。</footer>
  </main>
</body>
</html>
